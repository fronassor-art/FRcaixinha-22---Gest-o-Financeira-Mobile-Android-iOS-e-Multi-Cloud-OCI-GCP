name: FR Finance M41180 legacy GUC GET HEAD read guard
on:
  push:
    branches:
      - atualizacao-ai-studio-9b46a63187
    paths:
      - 'backend/app/database.py'
      - 'backend/tests/test_m41180_legacy_guc_get_guard_ci.py'
      - '.github/workflows/frfinance-m41180-legacy-guc-get-guard-ci.yml'
      - 'docs/FR_FINANCE_M41180_LEGACY_GUC_GET_GUARD_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/database.py'
      - 'backend/tests/test_m41180_legacy_guc_get_guard_ci.py'
      - '.github/workflows/frfinance-m41180-legacy-guc-get-guard-ci.yml'
      - 'docs/FR_FINANCE_M41180_LEGACY_GUC_GET_GUARD_NO_GO.md'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: >-
          python -B -m pytest -q -p no:cacheprovider
          backend/tests/test_m41180_legacy_guc_get_guard_ci.py
