name: FR Finance M39062 same UID launcher offline CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39062_same_uid_launcher_inventory.py'
      - 'backend/tests/test_m39062_same_uid_launcher_inventory_ci.py'
      - '.github/workflows/frfinance-m39062-same-uid-launcher-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-discovery-simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest only
        run: python -m pip install pytest==8.3.4
      - name: Synthetic same-UID process tree, never actual Termux
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39062_same_uid_launcher_inventory_ci.py
          echo 'M39062_CI_LIVE_PROCESS_ACCESS=NONE'
          echo 'M39062_CI_SOCKET_OWNER=NOT_ATTESTED'
          echo 'M39062_DATABASE_WRITES=NONE'
          echo 'M39062_PIX_REAL=OFF'
