name: FR Finance M39089 Android update signing and versionCode guard

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - '.github/workflows/validacao-atualizacao.yml'
      - '.github/workflows/frfinance-m39089-android-upgrade-ci.yml'
      - 'backend/tests/test_m39089_android_upgrade_version_ci.py'
      - 'docs/AI_STUDIO_ASSINATURA_PERSISTENTE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-main-apk-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Check old installed signer and reject APK version downgrade
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39089_android_upgrade_version_ci.py \
            backend/tests/test_m39065_stable_upgrade_apk_pipeline_ci.py
          echo 'M39089_CERT_AND_MONOTONIC_VERSION=PASS_STATIC'
          echo 'M39089_DB_WRITES=NONE'
          echo 'M39089_REAL_PIX=OFF'
          echo 'M39089_INSTALL_ATTEMPTED=NO'
