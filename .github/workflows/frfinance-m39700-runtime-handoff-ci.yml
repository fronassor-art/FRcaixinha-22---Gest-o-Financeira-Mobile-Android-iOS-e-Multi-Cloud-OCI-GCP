name: FR Finance M39700 — FastAPI runtime & credit 404 fail closed

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/main.py'
      - 'backend/app/m39700_runtime_contract.py'
      - 'backend/scripts/frfinance_m39700_termux_runtime_check.py'
      - 'backend/tests/test_m39700_runtime_attestation_ci.py'
      - '.github/workflows/frfinance-m39700-runtime-handoff-ci.yml'
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/m39700_runtime_contract.py'
      - 'backend/scripts/frfinance_m39700_termux_runtime_check.py'
      - 'backend/tests/test_m39700_runtime_attestation_ci.py'
      - '.github/workflows/frfinance-m39700-runtime-handoff-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m39700-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-404-and-readiness:
    name: Static runtime identity and safe phone handoff
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend:.
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned API dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.4
      - name: Verify source and synthetic runtime states only
        run: |
          python -B -m pytest -q -p no:cacheprovider backend/tests/test_m39700_runtime_attestation_ci.py backend/tests/test_m39501_fastapi_route_attestation_ci.py
          python -B backend/scripts/frfinance_m39700_termux_runtime_check.py --source-only
          echo 'M39700_DATABASE_CONNECTIONS_DIRECT=NONE'
          echo 'M39700_API_RESTART=NONE'
          echo 'M39700_REAL_FINANCE=OFF'
