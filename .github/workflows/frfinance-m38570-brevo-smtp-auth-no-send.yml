name: FR Finance M38570 Brevo SMTP STARTTLS AUTH no-send offline CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smtp-no-send-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: backend
      FR_FINANCE_EMAIL_REAL: "OFF"
      FR_FINANCE_PIX_REAL: "OFF"
      FR_FINANCE_REAL_USER_ACTIVATION: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencia pytest fixa sem credenciais
        run: python -m pip install pytest==8.3.4
      - name: Execucao offline sem chave SMTP, conexao ou envio real
        run: |
          python backend/scripts/aistudio_brevo_smtp_auth_nosend.py offline
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38570_brevo_smtp_auth_nosend_ci.py \
            backend/tests/test_m38530_brevo_account_domain_get_ci.py
          echo "M38649_SMTP_REAL_CONNECTION=NONE"
          echo "M38649_CREDENTIALS_IN_CI=NONE"
          echo "M38649_REAL_EMAIL=OFF"
          echo "M38649_DATABASE_MIGRATIONS=NONE"
          echo "M38649_REAL_PIX=OFF"
          echo "M38649_REAL_ACTIVATION=OFF"
          echo "M38649_PRODUCTION=BLOCKED"
