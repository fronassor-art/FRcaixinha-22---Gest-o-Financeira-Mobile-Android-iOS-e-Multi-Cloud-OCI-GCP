name: FR Finance M40800 supermacropacote DSN and migration NO-GO offline CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/database.py'
      - 'backend/app/m40800_financial_dsn_guard.py'
      - 'backend/scripts/frfinance_m40800_migration_delta_readonly.py'
      - 'backend/tests/test_m40800_security_migration_offline.py'
      - '.github/workflows/frfinance-m40800-security-migration-preflight-ci.yml'
      - 'docs/FR_FINANCE_M40800_SUPERMACRO_SECURITY_MIGRATION_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/database.py'
      - 'backend/app/m40800_financial_dsn_guard.py'
      - 'backend/scripts/frfinance_m40800_migration_delta_readonly.py'
      - 'backend/tests/test_m40800_security_migration_offline.py'
      - '.github/workflows/frfinance-m40800-security-migration-preflight-ci.yml'
permissions:
  contents: read
jobs:
  offline-dsn-migration-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40800_security_migration_offline.py
