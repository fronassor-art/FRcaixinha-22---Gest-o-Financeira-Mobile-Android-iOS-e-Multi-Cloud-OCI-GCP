name: FR Finance M39064 APK signer readonly offline CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39064_installed_apk_signer_readonly.py'
      - 'backend/tests/test_m39064_installed_apk_signer_readonly_ci.py'
      - '.github/workflows/frfinance-m39064-apk-signer-readonly-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest==8.3.4
      - name: Validate synthetic fingerprints and private file protections
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39064_installed_apk_signer_readonly_ci.py
          echo 'M39064_CI_REAL_KEY_READ=NONE'
          echo 'M39064_CI_KEY_GENERATION=NONE'
          echo 'M39064_DATABASE_WRITES=NONE'
          echo 'M39064_PIX_REAL=OFF'
