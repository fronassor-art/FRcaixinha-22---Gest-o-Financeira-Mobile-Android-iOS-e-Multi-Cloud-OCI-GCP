name: FR Finance M40930 Master SQL mutation NO-GO offline CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/m40930_master_write_no_go.py'
      - 'backend/app/routers/master.py'
      - 'backend/app/routers/saas_promotions.py'
      - 'backend/tests/test_m39067_master_saas_promotions_ci.py'
      - 'backend/tests/test_m40930_master_write_no_go_ci.py'
      - 'backend/app/m40840_financial_sql_release_no_go.py'
      - '.github/workflows/frfinance-m40930-master-write-no-go-ci.yml'
      - 'docs/FR_FINANCE_M40930_MASTER_WRITE_CONTAINMENT_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/m40930_master_write_no_go.py'
      - 'backend/app/routers/master.py'
      - 'backend/app/routers/saas_promotions.py'
      - 'backend/tests/test_m39067_master_saas_promotions_ci.py'
      - 'backend/tests/test_m40930_master_write_no_go_ci.py'
      - '.github/workflows/frfinance-m40930-master-write-no-go-ci.yml'
permissions:
  contents: read
jobs:
  no-live-master-sql-without-independent-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only API dependencies
        run: python -m pip install pytest==8.3.4 fastapi==0.115.8 pydantic==2.10.6 httpx==0.28.1
      - name: Master write fail-closed, explicit CI override and M40840 regression
        run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40930_master_write_no_go_ci.py
