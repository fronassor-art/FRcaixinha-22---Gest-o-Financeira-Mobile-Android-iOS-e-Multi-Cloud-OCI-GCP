name: FR Finance M38651 quota R150 and Termux regression hardening

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle-minimum-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      FRCAIXINHA_CI_ISOLATED: "0"
      FR_FINANCE_EMAIL_REAL: "OFF"
      FR_FINANCE_PIX_REAL: "OFF"
      FR_FINANCE_REAL_USER_ACTIVATION: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Contract floor (R$150) and legacy no-mutation static proof
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38651_cycle_minimum_contract_drift_ci.py
      - name: Test legacy CI guards and HTTP cookie origin hardening
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m20100_local_parity_schema_ci.py \
            backend/tests/test_m22300_cookie_origin_guard_ci.py
      - name: Check current source only — no DB or production release
        run: |
          echo "M38700_REPO_CONTRACT_R150_STATIC=CI_TESTED"
          echo "M38700_LOCAL_043_APPLIED=NOT_ATTESTED"
          echo "M38700_LOCAL_044_APPLIED=NOT_ATTESTED"
          echo "M38700_LEGACY_R100=READ_ONLY_HISTORICAL"
          echo "M38700_LOCAL_DB_MUTATIONS=NONE"
          echo "M38700_CLOUD_MUTATIONS=NONE"
          echo "M38700_EMAIL_REAL=OFF"
          echo "M38700_PIX_REAL=OFF"
          echo "M38700_PAYMENTS_REAL=OFF"
          echo "M38700_ACTIVATION_REAL=OFF"
          echo "M38700_PRODUCTION=BLOCKED"
