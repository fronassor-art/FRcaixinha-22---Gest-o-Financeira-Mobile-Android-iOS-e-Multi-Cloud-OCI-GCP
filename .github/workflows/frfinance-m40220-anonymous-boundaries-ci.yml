name: FR Finance M40220 — Anonymous role boundary and hidden GET checks

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40220_anonymous_role_boundaries_readonly.py'
      - 'backend/tests/test_m40220_anonymous_role_boundaries_ci.py'
      - '.github/workflows/frfinance-m40220-anonymous-boundaries-ci.yml'
      - 'docs/FR_FINANCE_M40220_ROLE_BOUNDARIES.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40220_anonymous_role_boundaries_readonly.py'
      - 'backend/tests/test_m40220_anonymous_role_boundaries_ci.py'
      - '.github/workflows/frfinance-m40220-anonymous-boundaries-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-anon-guards-and-synthetic-role-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Verify anonymous 401, hidden routes and synthetic roles
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40220_anonymous_role_boundaries_ci.py \
            backend/tests/test_m40210_hidden_route_openapi_ci.py \
            backend/tests/test_m40060_review_policy_api_ci.py \
            backend/tests/test_m39020_special_credit_api_ci.py \
            backend/tests/test_m39960_exclusive_cashbox_readiness_ci.py
          python -B backend/scripts/frfinance_m40220_anonymous_role_boundaries_readonly.py --source-only
          echo M40220_CI=PASS
          echo M40220_REAL_SESSIONS=NONE
          echo M40220_TERMINAL_DB_WRITES=NONE
          echo M40220_MIGRATIONS=NONE
          echo M40220_PIX_REAL=OFF
          echo M40220_PRODUCTION=BLOCKED
