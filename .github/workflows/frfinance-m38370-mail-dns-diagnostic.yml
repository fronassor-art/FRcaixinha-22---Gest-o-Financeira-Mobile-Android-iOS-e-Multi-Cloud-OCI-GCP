name: FR Finance M38370 staged public mail DNS diagnostics offline CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mail-dns-diagnostic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Verificar fases da consulta e segurança do modo diagnose sem rede
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38370_public_mail_dns_failure_diagnosis_ci.py \
            backend/tests/test_m38330_brevo_dkim_txt_live_path_ci.py \
            backend/tests/test_m38290_brevo_dns_policy_ci.py \
            backend/tests/test_m38250_mail_dns_readonly_ci.py \
            backend/tests/test_m27700_public_provider_intake_ci.py
          echo "M38409_DIAGNOSTIC_CI=OFFLINE_ONLY"
          echo "M38409_PUBLIC_DNS_QUERIES=NONE"
          echo "M38409_EMAIL_REAL=OFF"
          echo "M38409_PIX_REAL=OFF"
          echo "M38409_REAL_ACTIVATION=OFF"
          echo "M38409_PRODUCTION=BLOCKED"
