name: FR Finance M40680 digest-bound one-time financial SQL gateway CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40680_digest_one_time_gateway_disposable.py'
      - 'backend/tests/test_m40680_digest_one_time_ci.py'
      - '.github/workflows/frfinance-m40680-digest-one-time-ci.yml'
      - 'docs/FR_FINANCE_M40680_DIGEST_ONE_TIME_GATEWAY_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40680_digest_one_time_gateway_disposable.py'
      - 'backend/tests/test_m40680_digest_one_time_ci.py'
      - '.github/workflows/frfinance-m40680-digest-one-time-ci.yml'
      - 'docs/FR_FINANCE_M40680_DIGEST_ONE_TIME_GATEWAY_NO_GO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40680_digest_one_time_ci.py

  disposable-pg18-asgi:
    needs: offline-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m40680_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40680_synthetic_ci
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m40680_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40680_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_M40680_DATABASE_URL: postgresql://postgres:only_m40680_synthetic_ci@127.0.0.1:55437/fr_m40680_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4' 'fastapi==0.115.12' 'httpx==0.28.1'
      - run: |
          python -B backend/tests/m40680_digest_one_time_gateway_disposable.py
          echo M40680_ORIGINAL_PG=NEVER_CONNECTED
          echo M40680_REAL_HTTP=NOT_ACTIVATED
          echo M40680_DIGEST_AND_TICKET_RISK=NOT_REMEDIATED
          echo M40680_PRODUCTION=BLOCKED
