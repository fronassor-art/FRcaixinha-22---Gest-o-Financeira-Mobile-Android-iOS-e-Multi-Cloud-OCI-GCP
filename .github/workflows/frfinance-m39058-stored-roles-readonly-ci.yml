name: FR Finance M39058 - private role auth offline CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39057_stored_verifier_readonly.py'
      - 'backend/scripts/frfinance_m39058_three_roles_from_private_env.py'
      - 'backend/tests/test_m39057_stored_verifier_readonly_ci.py'
      - 'backend/tests/test_m39058_three_roles_from_private_env_ci.py'
      - '.github/workflows/frfinance-m39058-stored-roles-readonly-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated unit-test dependency only
        run: python -m pip install pytest==8.3.4
      - name: Credential guards and cross-project denial without PostgreSQL
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39057_stored_verifier_readonly_ci.py \
            backend/tests/test_m39058_three_roles_from_private_env_ci.py
          echo 'M39058_CI=OFFLINE_ONLY'
          echo 'M39058_TERMUX_SECRET_READ=NONE'
          echo 'M39058_DATABASE_WRITES=NONE'
          echo 'M39058_REAL_USER_LOGIN=NOT_TESTED'
          echo 'M39058_PIX_REAL=OFF'
