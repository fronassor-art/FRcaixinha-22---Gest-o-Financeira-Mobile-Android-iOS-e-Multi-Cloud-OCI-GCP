name: FR Finance M38001 identidade unica e vinculos seguros
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Testar unicidade de perfil e tenant
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q -p no:cacheprovider backend/tests/test_m38001_unique_login_scope_ci.py
          echo "M38012_PRODUCTION=BLOCKED"
  client-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/m38001_unique_identity_guidance_ci.test.ts
