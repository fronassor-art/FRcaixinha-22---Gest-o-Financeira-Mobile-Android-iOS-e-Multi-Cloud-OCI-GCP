name: FR Finance M38330 Brevo DKIM TXT parser and live-path mock CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brevo-dkim-public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Homologar DKIM TXT Brevo e simular operação live SEM DNS externo
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38330_brevo_dkim_txt_live_path_ci.py \
            backend/tests/test_m38290_brevo_dns_policy_ci.py \
            backend/tests/test_m38250_mail_dns_readonly_ci.py \
            backend/tests/test_m27700_public_provider_intake_ci.py
          echo "M38369_DNS_EXTERNAL_QUERIES=NONE"
          echo "M38369_BREVO_ACCOUNT_AUTHENTICATED=NOT_ATTESTED"
          echo "M38369_SMTP_SUBMISSIONS=NONE"
          echo "M38369_PIX_REAL=OFF"
          echo "M38369_ACTIVATION_REAL=OFF"
          echo "M38369_PRODUCTION=BLOCKED"
