name: FR Finance M38210 OCI VNIC NSG read-only perimeter offline CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vnic-nsg-perimeter:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Verificar perímetro VNIC NSG simulado sem OCI
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38210_oci_vnic_nsg_perimeter_ci.py \
            backend/tests/test_m37318_m37322_oci_operational_readiness_ci.py \
            backend/tests/test_m37470_oci_live_release_bridge_ci.py
          echo "M38249_OCI_LIVE_NOT_QUERIED_IN_CI=TRUE"
          echo "M38249_CLOUD_MUTATIONS=NONE"
          echo "M38249_EMAIL_REAL=OFF"
          echo "M38249_PIX_REAL=OFF"
          echo "M38249_PRODUCTION=BLOCKED"
