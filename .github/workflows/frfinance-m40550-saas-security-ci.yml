name: FR Finance M40550 SaaS security catalog-only CI
on:
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40550_saas_security_catalog_readonly.sql'
      - 'backend/scripts/frfinance_m40550_saas_security_catalog_readonly.sh'
      - 'backend/tests/test_frfinance_m40550_saas_security_ci.py'
      - '.github/workflows/frfinance-m40550-saas-security-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saas-security-catalog-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - name: Teste offline de permissões SaaS
        run: |
          python -B -m pytest -q -p no:cacheprovider backend/tests/test_frfinance_m40550_saas_security_ci.py
          echo M40550_ORIGINAL_PG=NOT_ACCESSED
          echo M40550_PRODUCTION=BLOCKED