name: FR Finance M40120 — HTTP-only health diagnosis

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40120_http_health_disambiguation_readonly.py'
      - 'backend/tests/test_m40120_http_health_disambiguation_ci.py'
      - '.github/workflows/frfinance-m40120-http-health-disambiguation-ci.yml'
      - 'docs/FR_FINANCE_M40120_HTTP_HEALTH_DISAMBIGUATION.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40120_http_health_disambiguation_readonly.py'
      - 'backend/tests/test_m40120_http_health_disambiguation_ci.py'
      - '.github/workflows/frfinance-m40120-http-health-disambiguation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-http-readonly-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Offline synthetic HTTP triage and previous safety regressions
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40120_http_health_disambiguation_ci.py \
            backend/tests/test_m40110_listener_correlation_ci.py \
            backend/tests/test_m40100_safe_runtime_triage_ci.py \
            backend/tests/test_m40090_old_fastapi_diagnosis_ci.py
          python -B backend/scripts/frfinance_m40120_http_health_disambiguation_readonly.py --source-only
          echo M40120_CI=PASS
          echo M40120_PROCESS_CONTROL=NONE
          echo M40120_ORIGINAL_DATABASE_ACCESS=NONE
          echo M40120_MIGRATIONS=NONE
          echo M40120_PIX_REAL=OFF
          echo M40120_PRODUCTION=BLOCKED
