name: FR Finance M40150 — Original PG18 status and readiness only

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40150_original_pg18_status_readonly.py'
      - 'backend/tests/test_m40150_original_pg18_status_ci.py'
      - '.github/workflows/frfinance-m40150-original-pg18-status-ci.yml'
      - 'docs/FR_FINANCE_M40150_ORIGINAL_PG18_STATUS.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40150_original_pg18_status_readonly.py'
      - 'backend/tests/test_m40150_original_pg18_status_ci.py'
      - '.github/workflows/frfinance-m40150-original-pg18-status-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-original-pg-status-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Synthetic original PG18 status & safety regressions
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40150_original_pg18_status_ci.py \
            backend/tests/test_m40140_original_launcher_preflight_ci.py \
            backend/tests/test_m40130_loopback_tcp_health_ci.py \
            backend/tests/test_m40120_http_health_disambiguation_ci.py \
            backend/tests/test_m40110_listener_correlation_ci.py
          python -B backend/scripts/frfinance_m40150_original_pg18_status_readonly.py --source-only
          echo M40150_CI=PASS
          echo M40150_REAL_DB_SQL_SESSIONS=NONE
          echo M40150_PG_START_STOP=NONE
          echo M40150_MIGRATIONS=NONE
          echo M40150_PIX_REAL=OFF
          echo M40150_PRODUCTION=BLOCKED
