name: FR Finance M40830 off-DB encryption, SQL GUC negative CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/m40830_financial_envelope_prototype.py'
      - 'backend/tests/test_m40830_sealed_reads_no_go_ci.py'
      - '.github/workflows/frfinance-m40830-sealed-reads-no-go-ci.yml'
      - 'docs/FR_FINANCE_M40830_SQL_GUC_SEALED_READ_PROTOTYPE_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/m40830_financial_envelope_prototype.py'
      - 'backend/tests/test_m40830_sealed_reads_no_go_ci.py'
      - '.github/workflows/frfinance-m40830-sealed-reads-no-go-ci.yml'
permissions:
  contents: read
jobs:
  sealed-member-read-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4 cryptography==50.0.2
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40830_sealed_reads_no_go_ci.py
