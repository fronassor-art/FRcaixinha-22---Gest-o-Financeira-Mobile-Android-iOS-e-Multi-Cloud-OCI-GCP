name: FR Finance M37974 seguranca de origem da API
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-network-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Origem segura e regressao de autenticacao
        run: |
          npx tsx src/tests/m37974_api_origin_notification_guard_ci.test.ts
          npx tsx src/tests/m37447_mobile_backend_diagnostic_ci.test.ts
          npx tsx src/tests/m19000_notifications_functional_ui.test.ts
          npx tsx src/tests/auth_context_security.test.ts
      - run: |
          echo "M37974_REAL_PIX=OFF"
          echo "M37974_REAL_USERS=OFF"
          echo "M37974_SQL_APPLY=NONE"
