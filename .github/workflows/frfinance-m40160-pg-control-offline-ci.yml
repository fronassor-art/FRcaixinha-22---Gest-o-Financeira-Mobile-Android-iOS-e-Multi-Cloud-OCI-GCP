name: FR Finance M40160 — Original PG18 offline control-state review

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40160_original_pg_control_offline_readonly.py'
      - 'backend/tests/test_m40160_original_pg_control_offline_ci.py'
      - '.github/workflows/frfinance-m40160-pg-control-offline-ci.yml'
      - 'docs/FR_FINANCE_M40160_OFFLINE_PG_CONTROL_RECOVERY.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40160_original_pg_control_offline_readonly.py'
      - 'backend/tests/test_m40160_original_pg_control_offline_ci.py'
      - '.github/workflows/frfinance-m40160-pg-control-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-original-pg-control-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Synthetic offline control-state and prior safety regressions
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40160_original_pg_control_offline_ci.py \
            backend/tests/test_m40150_original_pg18_status_ci.py \
            backend/tests/test_m40140_original_launcher_preflight_ci.py \
            backend/tests/test_m40130_loopback_tcp_health_ci.py \
            backend/tests/test_m40120_http_health_disambiguation_ci.py
          python -B backend/scripts/frfinance_m40160_original_pg_control_offline_readonly.py --source-only
          echo M40160_CI=PASS
          echo M40160_SQL_SESSIONS=NONE
          echo M40160_PG_START_STOP=NONE
          echo M40160_DATABASE_WRITES=NONE
          echo M40160_PIX_REAL=OFF
          echo M40160_PRODUCTION=BLOCKED
