name: FR Finance M40610 verified session before financial RLS pool
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/m40610_verified_rls_session.py'
      - 'backend/app/database.py'
      - 'backend/tests/test_m40610_verified_rls_session_ci.py'
      - '.github/workflows/frfinance-m40610-rls-session-provenance-ci.yml'
  pull_request:
    paths:
      - 'backend/app/m40610_verified_rls_session.py'
      - 'backend/app/database.py'
      - 'backend/tests/test_m40610_verified_rls_session_ci.py'
      - '.github/workflows/frfinance-m40610-rls-session-provenance-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-session-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - name: Fail-closed source checks and guard tests, without DB
        run: |
          python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40610_verified_rls_session_ci.py
          python -B backend/scripts/frfinance_m40580_sql_static_guard.py
          echo M40610_ORIGINAL_DB=NOT_ACCESSED
          echo M40610_DB_WRITES=NONE
          echo M40610_MIGRATIONS=NONE
          echo M40610_RESTARTS=NONE
          echo M40610_GUC_SPOOF_EXPOSURE=NOT_REMEDIATED
          echo M40610_PRODUCTION=BLOCKED
