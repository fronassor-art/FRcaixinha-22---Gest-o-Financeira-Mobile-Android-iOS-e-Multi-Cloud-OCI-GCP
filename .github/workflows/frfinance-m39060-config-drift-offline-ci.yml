name: FR Finance M39060 config drift offline CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39060_live_vs_private_api_config.py'
      - 'backend/tests/test_m39060_live_vs_private_api_config_ci.py'
      - '.github/workflows/frfinance-m39060-config-drift-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest==8.3.4
      - name: Test synthetic drift classifications; no real HTTP or SQL
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39060_live_vs_private_api_config_ci.py
          echo 'M39060_REAL_FASTAPI=NOT_CONTACTED_IN_CI'
          echo 'M39060_TERMINAL_SECRET_READ=NONE'
          echo 'M39060_DATABASE_WRITES=NONE'
          echo 'M39060_PIX_REAL=OFF'
