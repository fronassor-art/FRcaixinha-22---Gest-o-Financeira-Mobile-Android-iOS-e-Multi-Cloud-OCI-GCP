name: FR Finance M40590 financial role-scoped static SQL and disposable PG18 CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/routers/loans.py'
      - 'backend/app/routers/contributions.py'
      - 'backend/scripts/frfinance_m40580_sql_static_guard.py'
      - 'backend/tests/m40590_role_filtered_listing_disposable.py'
      - 'backend/tests/test_m40590_financial_route_sql_ci.py'
      - '.github/workflows/frfinance-m40590-literal-financial-queries-ci.yml'
  pull_request:
    paths:
      - 'backend/app/routers/loans.py'
      - 'backend/app/routers/contributions.py'
      - 'backend/scripts/frfinance_m40580_sql_static_guard.py'
      - 'backend/tests/m40590_role_filtered_listing_disposable.py'
      - 'backend/tests/test_m40590_financial_route_sql_ci.py'
      - '.github/workflows/frfinance-m40590-literal-financial-queries-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40590_financial_route_sql_ci.py

  pg18-synthetic-role-filter:
    runs-on: ubuntu-latest
    needs: source-only
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m40590_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40590_synthetic_ci
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m40590_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40590_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_M40590_DATABASE_URL: postgresql://postgres:only_m40590_synthetic_ci@127.0.0.1:55434/fr_m40590_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4'
      - run: |
          python -B backend/tests/m40590_role_filtered_listing_disposable.py
          echo M40590_ORIGINAL_PG18=NEVER_CONNECTED
          echo M40590_REAL_PAYMENTS=OFF
          echo M40590_PRODUCTION=BLOCKED