name: FR Finance M39078 campaign sandbox local flags CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39078_special_credit_sandbox_private_config.py'
      - 'backend/tests/test_m39078_sandbox_private_config_ci.py'
      - '.github/workflows/frfinance-m39078-special-credit-config-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-config-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_ACCESS_MAIL_ENABLE: 'OFF'
      FR_FINANCE_ACCESS_MAIL_WORKER: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Test original config edit safety and no provider operations
        run: |
          python -B -m pytest -q -p no:cacheprovider backend/tests/test_m39078_sandbox_private_config_ci.py
          echo 'M39078_CONFIG_CHANGE_IN_CI=NONE'
          echo 'M39078_PG18_ORIGINAL_CONNECTED=NO'
          echo 'M39078_PRODUCTION=BLOCKED'
          echo 'M39078_REAL_CREDIT=OFF'
          echo 'M39078_REAL_PIX=OFF'
          echo 'M39078_EXTERNAL_DISPATCH=OFF'
