name: FR Finance M40730 no DB signer key, SQL role split and NO-GO adversarial CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40730_offdb_signer_authority_disposable.py'
      - 'backend/tests/test_m40730_offdb_signer_ci.py'
      - '.github/workflows/frfinance-m40730-offdb-issuer-ci.yml'
      - 'docs/FR_FINANCE_M40730_OFFDB_SIGNER_BOUNDARY_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40730_offdb_signer_authority_disposable.py'
      - 'backend/tests/test_m40730_offdb_signer_ci.py'
      - '.github/workflows/frfinance-m40730-offdb-issuer-ci.yml'
      - 'docs/FR_FINANCE_M40730_OFFDB_SIGNER_BOUNDARY_NO_GO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40730_offdb_signer_ci.py

  pg18-signer-authority-adversarial:
    needs: offline-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m40730_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40730_fixture_ci
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m40730_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_M40730_DISPOSABLE: '1'
      CI_M40730_DATABASE_URL: postgresql://postgres:only_m40730_fixture_ci@127.0.0.1:55442/fr_m40730_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4' 'fastapi==0.115.12' 'httpx==0.28.1' 'cryptography==45.0.7'
      - run: |
          python -B backend/tests/m40730_offdb_signer_authority_disposable.py
          echo M40730_OFF_DB_PROOF=PASS_SYNTHETIC_ONLY
          echo M40730_STOLEN_SIGNER_SQL_LOGIN=CONFIRMED_NO_GO
          echo M40730_DB_OWNER_PRIVILEGE=NOT_REMEDIATED
          echo M40730_ORIGINAL_DB=NEVER_CONNECTED
          echo M40730_PRODUCTION=BLOCKED
