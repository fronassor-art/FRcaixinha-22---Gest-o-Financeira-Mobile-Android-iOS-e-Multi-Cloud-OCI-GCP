name: FR Finance M39084 Termux push package integrity and local recovery CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39084_termux_push_recover.sh'
      - 'backend/tests/test_m39084_termux_push_dependency_ci.py'
      - '.github/workflows/frfinance-m39084-termux-push-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-script-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for static checks only
        run: python -m pip install pytest
      - name: Validate no-write guard and lockfile consistency
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39084_termux_push_dependency_ci.py \
            backend/tests/test_m37979_termux_compiler_guard_ci.py
          echo 'M39084_TERMUX_REPAIR=NOT_EXECUTED_IN_CI'
          echo 'M39084_ORIGINAL_DATABASE=NOT_CONNECTED'
          echo 'M39084_REAL_PAYMENTS=OFF'

  official-linux-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_PIX_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install project dependencies from original lockfile
        run: npm ci
      - name: Typecheck with original TypeScript 7
        run: npm run lint
      - name: Run M39083 and navigation test scripts
        run: |
          npx tsx src/tests/m39083_cycle_readiness_ui_ci.test.ts
          npx tsx src/tests/m39076_tenant_campaigns_navigation_ci.test.ts
          npx tsx src/tests/m39020_credit_push_ui_ci.test.ts
          echo 'M39084_OFFICIAL_TYPESCRIPT7=PASS'
          echo 'M39084_EXTERNAL_DELIVERY=OFF'
