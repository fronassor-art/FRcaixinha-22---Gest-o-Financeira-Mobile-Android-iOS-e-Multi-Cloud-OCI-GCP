name: FR Finance M39086 general CI drift-safe rebaseline

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'src/tests/role_scope_ui.test.ts'
      - 'backend/tests/test_m19200_migration_inventory_ci.py'
      - '.github/workflows/validacao-atualizacao.yml'
      - 'backend/tests/test_m39086_general_ci_drift_ci.py'
      - '.github/workflows/frfinance-m39086-general-ci-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general-regression-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for static contract checks
        run: python -m pip install pytest
      - name: Validate migration counts and PostgreSQL backup safeguards
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39086_general_ci_drift_ci.py \
            backend/tests/test_m19200_migration_inventory_ci.py
          echo 'M39086_ORIGINAL_POSTGRESQL=NOT_CONNECTED'
          echo 'M39086_BACKUP_RESTORE=EXECUTED_ONLY_IN_MAIN_DISPOSABLE_CI'

  general-regression-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_PIX_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install from original lockfile
        run: npm ci
      - name: Official TypeScript7 check
        run: npm run lint
      - name: Role scope and campaign navigation
        run: |
          npx tsx src/tests/role_scope_ui.test.ts
          npx tsx src/tests/m39076_tenant_campaigns_navigation_ci.test.ts
          npx tsx src/tests/m39083_cycle_readiness_ui_ci.test.ts
          echo 'M39086_MASTER_TENANT_CREDIT_ISOLATION=CI_STATIC_TESTED'
          echo 'M39086_EXTERNAL_DISPATCH=OFF'
