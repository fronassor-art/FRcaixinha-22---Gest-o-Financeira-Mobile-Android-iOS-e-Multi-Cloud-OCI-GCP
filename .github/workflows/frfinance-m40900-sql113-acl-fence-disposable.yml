name: FR Finance M40900 SQL113 revoke table-column-definer disposable PG18
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40900_sql113_acl_fence_disposable.py'
      - 'backend/tests/test_m40900_sql113_acl_fence_ci.py'
      - '.github/workflows/frfinance-m40900-sql113-acl-fence-disposable.yml'
      - 'docs/FR_FINANCE_M40900_DISPOSABLE_SQL113_ACL_FENCE_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40900_sql113_acl_fence_disposable.py'
      - 'backend/tests/test_m40900_sql113_acl_fence_ci.py'
      - '.github/workflows/frfinance-m40900-sql113-acl-fence-disposable.yml'
permissions:
  contents: read
jobs:
  static-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40900_sql113_acl_fence_ci.py
  disposable-pg18-privilege-rehearsal:
    runs-on: ubuntu-latest
    needs: static-fail-closed
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m39067_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40900_disposable_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m39067_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40900_DISPOSABLE: '1'
      CI_M40560_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_PROMOTIONS_DATABASE_URL: postgresql://postgres:only_m40900_disposable_ci@127.0.0.1:55433/fr_m39067_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4'
      - run: python -B backend/tests/m40900_sql113_acl_fence_disposable.py
