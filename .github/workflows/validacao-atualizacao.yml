name: Validação da atualização AI Studio

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend e regras locais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Tipagem
        run: npm run lint
      - name: Testes TypeScript
        run: npm run test:audit
      - name: Testes de integração do estado financeiro
        run: npx tsx src/tests/server_integration.test.ts
      - name: Build web
        run: npm run build

  android:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm ci
      - name: Build e sincronização Capacitor (FastAPI no loopback do APK debug)
        env:
          FRCAIXINHA_ANDROID_LOCAL_TEST: '1'
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run cap:build
      - name: Validar URL e esquema Android debug
        run: |
          node -e "const c=require('./android/app/src/main/assets/capacitor.config.json'); if(c.server.androidScheme!=='http' || c.server.cleartext!==false) process.exit(1)"
          grep -RlF 'http://127.0.0.1:8000' dist/assets | grep -q .
      - name: Compilar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Disponibilizar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: frcaixinha-ai-studio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  backend-sem-banco:
    name: API sem banco configurado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt
      - name: Verificar importação do FastAPI
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import app; print('FastAPI importado')"
      - name: Executar testes de API
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q backend/tests/test_rls_and_api.py -k TestFastAPIApiEndpoints
          python -m pytest -q --asyncio-mode=auto backend/tests/test_security_guards.py backend/tests/test_mercado_pago_safety.py backend/tests/test_mercado_pago_adapter.py backend/tests/test_price_contract.py backend/tests/test_annual_consent.py
          python -m pytest -q backend/tests/test_termux_local_backend.py
          python -m pytest -q backend/tests/test_aistudio_master_local_setup.py

  postgres-isolado:
    name: Migrações e testes de RLS em PostgreSQL descartável
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: frcaixinha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frcaixinha_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt
      - name: Aplicar migrações no banco descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/migrations/001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_financial_extensions.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/003_canonical_ledger_and_pix.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_quota_read_isolation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/005_restrict_identity_privileges.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/006_auth_test_access.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/007_contribution_read_isolation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/008_persistent_auth_sessions.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/009_tenant_context_and_references.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/010_ledger_integrity.sql
      - name: Criar usuário de aplicação para teste
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_app_role TO frcaixinha_ci"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_auth_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_auth_role TO frcaixinha_auth_ci"
      - name: Executar testes existentes de RLS
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://frcaixinha_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q --asyncio-mode=auto backend/tests/test_rls_and_api.py -k TestPostgreSQLRowLevelSecurityCRUD

      - name: Testar isolamento com registros sintéticos
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          CI_AUTH_DATABASE_URL: postgresql://frcaixinha_auth_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          DATABASE_URL: postgresql://frcaixinha_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q --asyncio-mode=auto backend/tests/test_rls_isolation_ci.py

      - name: Testar prontidão FastAPI com PostgreSQL descartável
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          FRCAIXINHA_TEST_AUTH: '1'
          ENVIRONMENT: homologation
          AUTH_DATABASE_URL: postgresql://frcaixinha_auth_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          DATABASE_URL: postgresql://frcaixinha_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q backend/tests/test_termux_readiness_ci.py

      - name: Testar bootstrap em banco descartável
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q backend/tests/test_bootstrap_ci.py backend/tests/test_tenant_provisioning_ci.py

      - name: Backup cifrado age e restauração descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age-keygen -o "$RUNNER_TEMP/frcaixinha-ci-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/frcaixinha-ci-identity.txt")"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO users(email,full_name,cpf,phone) VALUES('backup-ci@example.invalid','Backup sintético','00000000000000','00000000000')"
          AGE_RECIPIENT="$recipient" BACKUP_OUTPUT="$RUNNER_TEMP/frcaixinha-ci.dump.age" bash backend/scripts/backup_age.sh
          createdb frcaixinha_restore_ci
          PGDATABASE=frcaixinha_restore_ci AGE_IDENTITY_FILE="$RUNNER_TEMP/frcaixinha-ci-identity.txt" BACKUP_INPUT="$RUNNER_TEMP/frcaixinha-ci.dump.age" bash backend/scripts/restore_disposable_ci.sh
          original="$(psql -tAc "SELECT count(*) FROM users WHERE email='backup-ci@example.invalid'")"
          restored="$(PGDATABASE=frcaixinha_restore_ci psql -tAc "SELECT count(*) FROM users WHERE email='backup-ci@example.invalid'")"
          test "$original" = "1"
          test "$restored" = "$original"
