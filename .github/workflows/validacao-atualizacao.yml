          CI_VERIFIER_DATABASE_URL: postgresql://frcaixinha_pg18_verifier:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          DATABASE_URL: postgresql://frcaixinha_pg18_app:ci-test-only@127.0.0.1:5432/frcaixinha_ci
