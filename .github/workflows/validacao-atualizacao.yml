          python -m pytest -q --asyncio-mode=auto backend/tests/test_member_cycle_risk_api_ci.py
          python -m pytest -q backend/tests/test_member_obligations_oracle_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_member_obligations_api_ci.py
          python -m pytest -q backend/tests/test_financial_integrity_oracle_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_financial_integrity_api_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_member_lifecycle_sandbox_ci.py
          python -m pytest -q backend/tests/test_migration_028_contract_ci.py
          python -m pytest -q backend/tests/test_migration_029_contract_ci.py
          python -m pytest -q backend/tests/test_migration_030_contract_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_member_lifecycle_reviews_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_m2040_sandbox_persistence_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_m2500_mp_connect_inbox_persistence_ci.py
      - name: Verificar provas e rotacao P0-01g PostgreSQL 18 descartavel
        env:
          PYTHONPATH: backend
