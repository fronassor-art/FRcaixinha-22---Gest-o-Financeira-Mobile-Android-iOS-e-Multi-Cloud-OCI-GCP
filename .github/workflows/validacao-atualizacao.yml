  postgres-isolado:
    name: Migrações e testes de RLS em PostgreSQL descartável
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: frcaixinha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frcaixinha_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt
      - name: Aplicar migrações no banco descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/migrations/001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_financial_extensions.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/003_canonical_ledger_and_pix.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_quota_read_isolation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/005_restrict_identity_privileges.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/006_auth_test_access.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/007_contribution_read_isolation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/008_persistent_auth_sessions.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/009_tenant_context_and_references.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/010_ledger_integrity.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/011_platform_license_catalog.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/012_minimize_application_identity_access.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/013_users_identity_rls.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/014_account_lifecycle_preparation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/015_contract_versions_and_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/016_saas_preparations_no_billing.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/017_saas_payment_activation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/018_invite_email_verification.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/019_named_contexts_and_session_inventory.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/020_session_bound_named_contexts.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/021_session_bound_memberships.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/022_auth_session_issuance_limits.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/023_session_context_guarded_transition.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/024_token_bound_session_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/025_verifier_bound_session_issuance.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/026_credential_bound_proofs_and_session_revocation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/027_shared_login_attempt_limits.sql
          # CI original: backend/migrations/028_member_lifecycle_sandbox_requests.sql
          # CI original: backend/migrations/029_member_lifecycle_review_events.sql
          # CI original: backend/migrations/030_member_lifecycle_case_rounds.sql
          # Run exact local forks against disposable PostgreSQL 16.
          PGOPTIONS='-c frcaixinha.lifecycle_local_ci=1' \
            psql -X -v ON_ERROR_STOP=1 --single-transaction \
            -f backend/local_migrations/028_member_lifecycle_sandbox_requests.sql \
            -f backend/local_migrations/029_member_lifecycle_review_events.sql \
            -f backend/local_migrations/030_member_lifecycle_case_rounds.sql
          PGOPTIONS='-c frcaixinha.notifications_local_ci=1' psql -X -v ON_ERROR_STOP=1 --single-transaction -f backend/migrations/031_notification_inbox_local_sandbox.sql
          bash backend/scripts/aistudio_local_parity_034_041_ci.sh
          PGOPTIONS='-c frcaixinha.cycle_price_local_ci=1' psql -X -v ON_ERROR_STOP=1 --single-transaction -f backend/local_migrations/042_cycle_contribution_price_audit.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/m20400_cycle_policy_functional_ci.sql
          PGOPTIONS='-c frcaixinha.quota_floor_local_ci=1' psql -X -v ON_ERROR_STOP=1 --single-transaction -f backend/local_migrations/043_cycle_contribution_contract_minimum.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/m20700_quota_floor_functional_ci.sql
          PGOPTIONS='-c frcaixinha.cycle_open_local_ci=1' psql -X -v ON_ERROR_STOP=1 --single-transaction -f backend/local_migrations/044_cycle_opening_audit.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/m21000_cycle_opening_functional_ci.sql
          # M33400-M33800: admission read policy tested in disposable PostgreSQL.
          PGOPTIONS='-c frcaixinha.saas_admission_ci=1' psql -X -v ON_ERROR_STOP=1 -f backend/local_migrations/045_saas_member_plan_visibility.sql
          # M33900-M34300: tested ONLY in disposable PostgreSQL CI.
          PGOPTIONS='-c frcaixinha.saas_write_lock_ci=1' psql -X -v ON_ERROR_STOP=1 -f backend/local_migrations/046_saas_membership_quota_write_lock.sql
          # CI-only, fora do diretorio de migracoes do Termux.
          PGOPTIONS='-c frcaixinha.ci_sandbox=1' psql -X -v ON_ERROR_STOP=1 -f backend/ci_migrations/031_mp_sandbox_evidence_ci_only.sql
          PGOPTIONS='-c frcaixinha.ci_sandbox=1' psql -X -v ON_ERROR_STOP=1 -f backend/ci_migrations/032_mp_connect_inbox_ci_only.sql
      - name: Criar usuário de aplicação para teste
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_app_role TO frcaixinha_ci"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_auth_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
