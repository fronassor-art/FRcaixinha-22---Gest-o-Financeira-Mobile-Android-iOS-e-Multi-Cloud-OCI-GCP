name: Validação da atualização AI Studio

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend e regras locais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Tipagem
        run: npm run lint
      - name: Testes TypeScript
        run: npm run test:audit
      - name: Testes de integração do estado financeiro
        run: npx tsx src/tests/server_integration.test.ts
      - name: Testes de identidade única, contexto e concorrência no cliente
        run: npx tsx src/tests/auth_context_security.test.ts
      - name: Testar cliente dos tres perfis no APK
        run: npx tsx src/tests/mobile_three_profiles.test.ts
      - name: Testar acesso distinto por novo login para Master Admin e Membro
        run: npx tsx src/tests/mobile_master_multi_role.test.ts
      - name: Validar Macropacote 140 — vinte fronteiras de contexto e sessoes
        run: npx tsx src/tests/macropacote_140_auth_boundary_ci.test.ts
      - name: Verificar segregacao do menu de cada perfil
        run: npx tsx src/tests/role_scope_ui.test.ts
      - name: Regressao Livro-Razao acessivel somente ao administrador
        run: npx tsx src/tests/ledger_menu_visibility_ci.test.ts
      - name: Validar caminhos de primeiro acesso sem auto-cadastro
        run: npx tsx src/tests/login_first_access_ui.test.ts
      - name: Validar entrada reservada e confirmacao Master
        run: npx tsx src/tests/owner_private_access_ui.test.ts
      - name: Validar governanca Master e segregacao da interface
        run: npx tsx src/tests/master_tenant_registry_ui.test.ts
      - name: Validar responsaveis cadastrais Master
        run: npx tsx src/tests/master_admin_registry_ui.test.ts
      - name: Validar Macropacote 120 — inventario SaaS Master
        run: npx tsx src/tests/master_saas_portfolio_ci.test.ts
      - name: Validar pre-analise Master de convites e estados seguros
        run: npx tsx src/tests/master_onboarding_preflight_ui.test.ts
      - name: Validar simulador de fluxo, idempotencia e auditoria Master
        run: npx tsx src/tests/master_workflow_audit_ui.test.ts
      - name: Validar isolamento de paineis e membros por tenant no cliente
        run: npx tsx src/tests/tenant_read_boundary_ci.test.ts
      - name: Diagnosticar causas seguras de bloqueio Price no APK
        run: npx tsx src/tests/loan_simulation_feedback_ci.test.ts
      - name: Validar cronograma Price e rejeicao de simulacao tardia
        run: npx tsx src/tests/loan_simulation_integrity_ci.test.ts
      - name: Macropacote 180 — Price, sessao e consentimento
        run: npx tsx src/tests/macropacote_180_credit_ci.test.ts
      - name: Validar erros HTTP seguros e integridade do JSON financeiro
        run: npx tsx src/tests/api_response_policy_ci.test.ts
      - name: Validar previa anual individual e nao apuracao de lucro
        run: npx tsx src/tests/member_annual_preview_ci.test.ts
      - name: Validar previa anual operacional do Admin sem liquidação
        run: npx tsx src/tests/admin_annual_preview_ci.test.ts
      - name: Macropacote 160 — 20 validacoes de previa registrada
        run: npx tsx src/tests/macropacote_160_preview_ci.test.ts
      - name: Macropacote 200 — Livro-Razao e integridade do cliente
        run: npx tsx src/tests/macropacote_200_ledger_ci.test.ts
      - name: Macropacote 220 — detalhes contabeis seguros e isolamento
        run: npx tsx src/tests/macropacote_220_ledger_boundary_ci.test.ts
      - name: M300 — extrato contábil por conta, paginação e segregação
        run: npx tsx src/tests/macropacote_300_ledger_account_entries_ci.test.ts
      - name: M320 — diretório sem saldos e segregação no frontend
        run: npx tsx src/tests/macropacote_320_ledger_empty_ci.test.ts
      - name: M320 — máquina de estados de visibilidade contábil
        run: npx tsx src/tests/macropacote_320_visibility_policy_ci.test.ts
      - name: M360 — navegação por cursor, parser e isolamento da sessão
        run: npx tsx src/tests/macropacote_360_keyset_ci.test.ts
      - name: M300 — identidade FR Caixinha e contrato comum
        run: npx tsx src/tests/macropacote_300_product_identity_ci.test.ts
      - name: Macropacote 220 — validar comando somente leitura Termux
        run: bash -n backend/scripts/aistudio_220_termux_readonly_checkpoint.sh
      - name: Macropacote 240 e 280 — scripts somente leitura
        run: |
          bash -n backend/scripts/aistudio_240_roles_readonly.sh
          bash -n backend/scripts/aistudio_240_backup_integrity_readonly.sh
          bash -n backend/scripts/aistudio_280_runtime_readonly.sh
          bash -n backend/scripts/aistudio_300_checkpoint_readonly.sh
          bash -n backend/scripts/aistudio_320_checkpoint_readonly.sh
          bash -n backend/scripts/aistudio_360_checkpoint_readonly.sh
      - name: Validar contrato financeiro de contribuições, datas e centavos
        run: npx tsx src/tests/contributions_integrity_ci.test.ts
      - name: Validar leituras de emprestimos e contribuições por perfil
        run: npx tsx src/tests/financial_read_boundary_ci.test.ts
      - name: Validar reautenticacao ao retornar do segundo plano
        run: npx tsx src/tests/session_resume_guard_ci.test.ts
      - name: Validar inventario de sessoes e revogacao no cliente
        run: npx tsx src/tests/session_inventory_security_ci.test.ts
      - name: Validar Master explicito e rejeicao de login concorrente
        run: npx tsx src/tests/owner_login_hardening_ci.test.ts
      - name: Validar concorrencia de sessoes e falhas de rede no frontend
        run: npx tsx src/tests/session_resilience_ci.test.ts
      - name: Validar matriz de permissoes declaradas no cliente Master
        run: npx tsx src/tests/master_permission_matrix_ui.test.ts
      - name: Validar barras de sistema e safe area Android
        run: npx tsx src/tests/android_safe_area_ci.test.ts
      - name: Validar identidade visual e separacao por perfil
        run: npx tsx src/tests/premium_brand_ui.test.ts
      - name: Build web
        env:
          VITE_APP_BUILD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

  android:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm ci
      - name: Build e sincronização Capacitor (FastAPI no loopback do APK debug)
        env:
          FRCAIXINHA_ANDROID_LOCAL_TEST: '1'
          VITE_API_URL: http://127.0.0.1:8000
          VITE_APP_BUILD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run cap:build
      - name: Validar URL e esquema Android debug
        env:
          VITE_APP_BUILD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e "const c=require('./android/app/src/main/assets/capacitor.config.json'); if(c.server.androidScheme!=='http' || c.server.cleartext!==false || c.plugins?.SystemBars?.insetsHandling!=='css' || c.plugins?.SystemBars?.style!=='DARK') process.exit(1)"
          grep -RlF 'http://127.0.0.1:8000' dist/assets | grep -q .
          grep -RlF "${VITE_APP_BUILD_REF:0:7}" dist/assets | grep -q .
      - name: Preparar assinatura persistente para atualizacoes
        env:
          ANDROID_SIGNING_JKS_BASE64: ${{ secrets.FRCAIXINHA_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.FRCAIXINHA_ANDROID_STORE_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.FRCAIXINHA_ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.FRCAIXINHA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_JKS_BASE64" || -z "$ANDROID_SIGNING_STORE_PASSWORD" || -z "$ANDROID_SIGNING_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Assinatura persistente ausente. Configure os quatro Actions secrets FRCAIXINHA_ANDROID_* conforme docs/AI_STUDIO_ASSINATURA_PERSISTENTE.md."
            exit 1
          fi
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/frcaixinha-aistudio-stable-signing.p12"
          printf '%s' "$ANDROID_SIGNING_JKS_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storetype PKCS12 -alias "$ANDROID_SIGNING_ALIAS" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Arquivo de assinatura, alias ou senha invalidos."
            exit 1
          fi
          echo "FRCAIXINHA_ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
      - name: Compilar APK assinado para atualizacoes futuras
        working-directory: android
        env:
          FRCAIXINHA_ANDROID_REQUIRE_STABLE_SIGNING: '1'
          FRCAIXINHA_ANDROID_VERSION_CODE: ${{ github.run_number }}
          FRCAIXINHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FRCAIXINHA_ANDROID_STORE_PASSWORD }}
          FRCAIXINHA_ANDROID_KEY_ALIAS: ${{ secrets.FRCAIXINHA_ANDROID_KEY_ALIAS }}
          FRCAIXINHA_ANDROID_KEY_PASSWORD: ${{ secrets.FRCAIXINHA_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Verificar pacote Android independente antes do upload
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/ai-studio-apk-badging.txt
          grep -F "package: name='com.frcaixinha.app.aistudio'" /tmp/ai-studio-apk-badging.txt
          grep -F "versionCode='${{ github.run_number }}'" /tmp/ai-studio-apk-badging.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/frcaixinha-apk-signing.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/frcaixinha-apk-signing.txt
          grep -E "Signer: certificate SHA-256 digest:" /tmp/frcaixinha-apk-signing.txt
      - name: Disponibilizar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: frcaixinha-ai-studio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  backend-sem-banco:
    name: API sem banco configurado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt
      - name: Verificar importação do FastAPI
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import app; print('FastAPI importado')"
      - name: Executar testes de API
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q backend/tests/test_rls_and_api.py -k TestFastAPIApiEndpoints
          python -m pytest -q --asyncio-mode=auto backend/tests/test_security_guards.py backend/tests/test_mercado_pago_safety.py backend/tests/test_mercado_pago_adapter.py backend/tests/test_price_contract.py backend/tests/test_annual_consent.py
          python -m pytest -q backend/tests/test_cashbox_segregation_and_profit_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_180_credit_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_200_ledger_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_220_audit_ci.py
          python -m pytest -q backend/tests/test_aistudio_240_gates.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_260_ledger_read_ci.py
          python -m pytest -q backend/tests/test_macropacote_280_runtime_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_300_ledger_journal_ci.py
          python -m pytest -q backend/tests/test_macropacote_300_runtime_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_320_empty_directory_ci.py
          python -m pytest -q backend/tests/test_macropacote_320_directory_http_ci.py
          python -m pytest -q backend/tests/test_macropacote_320_runtime_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_macropacote_360_keyset_ci.py
          python -m pytest -q backend/tests/test_macropacote_360_runtime_ci.py
          python -m pytest -q backend/tests/test_termux_local_backend.py
          python -m pytest -q backend/tests/test_aistudio_master_local_setup.py
          python -m pytest -q backend/tests/test_aistudio_real_panels.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_price_policy_authority.py
          python -m pytest -q backend/tests/test_aistudio_master_catalog.py -k 'not disposable_postgres'
          python -m pytest -q backend/tests/test_owner_private_access.py
          python -m pytest -q backend/tests/test_master_tenant_registry.py
          python -m pytest -q backend/tests/test_master_admin_registry.py
          python -m pytest -q backend/tests/test_master_saas_portfolio_ci.py
          python -m pytest -q backend/tests/test_master_onboarding_preflight.py
          python -m pytest -q backend/tests/test_master_workflow_audit.py
          python -m pytest -q backend/tests/test_master_permission_matrix.py
          python -m pytest -q backend/tests/test_aistudio_lifecycle_disabled.py
          python -m pytest -q backend/tests/test_auth_context_security_headers.py
          python -m pytest -q backend/tests/test_macropacote_140_access_ci.py
          python -m pytest -q backend/tests/test_macropacote_160_preview_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_auth_session_fail_closed_ci.py
          python -m pytest -q backend/tests/test_master_explicit_login_policy.py
          python -m pytest -q backend/tests/test_aistudio_governance_api.py
          python -m pytest -q backend/tests/test_platform_provider_adapters.py backend/tests/test_aistudio_live_status_api.py

  postgres-isolado:
    name: Migrações e testes de RLS em PostgreSQL descartável
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: frcaixinha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frcaixinha_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt
      - name: Aplicar migrações no banco descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/migrations/001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_financial_extensions.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/003_canonical_ledger_and_pix.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_quota_read_isolation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/005_restrict_identity_privileges.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/006_auth_test_access.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/007_contribution_read_isolation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/008_persistent_auth_sessions.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/009_tenant_context_and_references.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/010_ledger_integrity.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/011_platform_license_catalog.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/012_minimize_application_identity_access.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/013_users_identity_rls.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/014_account_lifecycle_preparation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/015_contract_versions_and_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/016_saas_preparations_no_billing.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/017_saas_payment_activation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/018_invite_email_verification.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/019_named_contexts_and_session_inventory.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/020_session_bound_named_contexts.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/021_session_bound_memberships.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/022_auth_session_issuance_limits.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/023_session_context_guarded_transition.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/024_token_bound_session_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/025_verifier_bound_session_issuance.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/026_credential_bound_proofs_and_session_revocation.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/027_shared_login_attempt_limits.sql
      - name: Criar usuário de aplicação para teste
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_app_role TO frcaixinha_ci"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_auth_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_auth_role TO frcaixinha_auth_ci"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_verifier_ci LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_verifier_role TO frcaixinha_verifier_ci"
      - name: Executar testes existentes de RLS
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://frcaixinha_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q --asyncio-mode=auto backend/tests/test_rls_and_api.py -k TestPostgreSQLRowLevelSecurityCRUD

      - name: Testar isolamento com registros sintéticos
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          CI_AUTH_DATABASE_URL: postgresql://frcaixinha_auth_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          CI_VERIFIER_DATABASE_URL: postgresql://frcaixinha_verifier_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          AUTH_RATE_LIMIT_HMAC_KEY: ci-only-test-hmac-secret-of-40-bytes-placeholder
          DATABASE_URL: postgresql://frcaixinha_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: |
          python -m pytest -q --asyncio-mode=auto backend/tests/test_rls_isolation_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_onboarding_permission_matrix_ci.py
          python -m pytest -q backend/tests/test_aistudio_master_catalog.py -k disposable_postgres
          python -m pytest -q backend/tests/test_aistudio_account_lifecycle_ci.py
          python -m pytest -q backend/tests/test_aistudio_governance_ci.py
          python -m pytest -q backend/tests/test_aistudio_live_engines_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_aistudio_named_sessions_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_p0_01g_credential_proof_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_p0_01h_shared_rate_limit_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_p0_01h_login_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_aistudio_roles_e2e_ci.py
          python -m pytest -q -s --asyncio-mode=auto backend/tests/test_aistudio_financial_lab_integrated_ci.py
          python -m pytest -q backend/tests/test_cashbox_segregation_and_profit_ci.py

      - name: Testar prontidão FastAPI com PostgreSQL descartável
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          FRCAIXINHA_TEST_AUTH: '1'
          ENVIRONMENT: homologation
          AUTH_DATABASE_URL: postgresql://frcaixinha_auth_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          AUTH_VERIFIER_DATABASE_URL: postgresql://frcaixinha_verifier_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          AUTH_RATE_LIMIT_HMAC_KEY: ci-only-test-hmac-secret-of-40-bytes-placeholder
          DATABASE_URL: postgresql://frcaixinha_ci:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q backend/tests/test_termux_readiness_ci.py

      - name: Testar bootstrap em banco descartável
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q backend/tests/test_bootstrap_ci.py backend/tests/test_tenant_provisioning_ci.py

      - name: Backup cifrado age e restauração descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age-keygen -o "$RUNNER_TEMP/frcaixinha-ci-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/frcaixinha-ci-identity.txt")"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO users(email,full_name,cpf,phone) VALUES('backup-ci@example.invalid','Backup sintético','00000000000000','00000000000')"
          AGE_RECIPIENT="$recipient" BACKUP_OUTPUT="$RUNNER_TEMP/frcaixinha-ci.dump.age" bash backend/scripts/backup_age.sh
          createdb frcaixinha_restore_ci
          PGDATABASE=frcaixinha_restore_ci AGE_IDENTITY_FILE="$RUNNER_TEMP/frcaixinha-ci-identity.txt" BACKUP_INPUT="$RUNNER_TEMP/frcaixinha-ci.dump.age" bash backend/scripts/restore_disposable_ci.sh
          original="$(psql -tAc "SELECT count(*) FROM users WHERE email='backup-ci@example.invalid'")"
          restored="$(PGDATABASE=frcaixinha_restore_ci psql -tAc "SELECT count(*) FROM users WHERE email='backup-ci@example.invalid'")"
          test "$original" = "1"
          test "$restored" = "$original"

  postgres18-preflight:
    name: PostgreSQL 18 preflight — transacao unica e RLS Master
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: frcaixinha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frcaixinha_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias Python
        run: python -m pip install -r backend/requirements.txt
      - name: Migrar 001-027 em UMA transacao no PostgreSQL 18 descartavel
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-test-only
          PGDATABASE: frcaixinha_ci
        run: |
          set -euo pipefail
          # Reproduzir os papeis tecnicos locais SEM tocar o banco Termux.
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE frc_ai_app LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE frc_ai_auth LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          scripts=()
          for i in $(seq 1 27); do
            printf -v n '%03d' "$i"
            files=(backend/migrations/"$n"_*.sql)
            test "${#files[@]}" -eq 1
            test -f "${files[0]}"
            scripts+=(-f "${files[0]}")
          done
          scripts+=(-f backend/scripts/aistudio_post_migration_roles.sql)
          psql -X -v ON_ERROR_STOP=1 --single-transaction "${scripts[@]}"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_pg18_app LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_app_role TO frcaixinha_pg18_app"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_pg18_auth LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_auth_role TO frcaixinha_pg18_auth"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE frcaixinha_pg18_verifier LOGIN PASSWORD 'ci-test-only' NOSUPERUSER NOBYPASSRLS INHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT frcaixinha_verifier_role TO frcaixinha_pg18_verifier"
      - name: Verificar RLS do Master e precos com usuarios sinteticos
        env:
          PYTHONPATH: backend
          AI_STUDIO_CI_PG18: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          DATABASE_URL: postgresql://frcaixinha_pg18_app:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: python -m pytest -q --asyncio-mode=auto backend/tests/test_aistudio_pg18_preflight.py
      - name: Auditoria financeira integrada ficticia no PostgreSQL 18 descartavel
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          DATABASE_URL: postgresql://frcaixinha_pg18_app:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: |
          python -m pytest -q -s --asyncio-mode=auto backend/tests/test_aistudio_financial_lab_integrated_ci.py
          python -m pytest -q backend/tests/test_cashbox_segregation_and_profit_ci.py
      - name: Verificar provas e rotacao P0-01g PostgreSQL 18 descartavel
        env:
          PYTHONPATH: backend
          FRCAIXINHA_CI_ISOLATED: '1'
          CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          CI_AUTH_DATABASE_URL: postgresql://frcaixinha_pg18_auth:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          CI_VERIFIER_DATABASE_URL: postgresql://frcaixinha_pg18_verifier:ci-test-only@127.0.0.1:5432/frcaixinha_ci
          DATABASE_URL: postgresql://frcaixinha_pg18_app:ci-test-only@127.0.0.1:5432/frcaixinha_ci
        run: |
          python -m pytest -q --asyncio-mode=auto backend/tests/test_p0_01g_credential_proof_ci.py
          python -m pytest -q --asyncio-mode=auto backend/tests/test_p0_01h_shared_rate_limit_ci.py

  exportar-fonte-ai-studio:
    name: Empacotar codigo-fonte para AI Studio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verificar snapshot e montar ZIP do codigo-fonte
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          # Recusar arquivos tipicamente secretos que nao podem ir ao AI Studio.
          if git ls-files | grep -E '(^|/)(\.env$|\.env\.(local|production)$|[^/]+\.(pem|p12|pfx|jks|keystore|key|dump|sqlite|db)$)'; then
            echo "BLOQUEADO: possiveis segredos versionados."
            exit 1
          fi
          mkdir -p export
          git archive --format=zip --prefix=AI_Studio/ --output=export/AI_Studio_Codigo_Fonte.zip HEAD
          unzip -t export/AI_Studio_Codigo_Fonte.zip
          sha256sum export/AI_Studio_Codigo_Fonte.zip > export/SHA256_codigo_fonte.txt
          git rev-parse HEAD > export/COMMIT_ORIGEM.txt
      - name: Disponibilizar pacote de codigo-fonte
        uses: actions/upload-artifact@v4
        with:
          name: AI_Studio_Codigo_Fonte_Snapshot
          path: export/
          if-no-files-found: error
          retention-days: 7
