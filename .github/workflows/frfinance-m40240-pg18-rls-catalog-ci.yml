name: FR Finance M40240 — Original PG18 RLS catalog read-only contract

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40240_pg18_rls_catalog_readonly.sql'
      - 'backend/scripts/frfinance_m40240_pg18_rls_catalog_readonly.sh'
      - 'backend/tests/test_m40240_pg18_rls_catalog_ci.py'
      - '.github/workflows/frfinance-m40240-pg18-rls-catalog-ci.yml'
      - 'docs/FR_FINANCE_M40240_RLS_CATALOG.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40240_pg18_rls_catalog_readonly.sql'
      - 'backend/scripts/frfinance_m40240_pg18_rls_catalog_readonly.sh'
      - 'backend/tests/test_m40240_pg18_rls_catalog_ci.py'
      - '.github/workflows/frfinance-m40240-pg18-rls-catalog-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-contract-and-legacy-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Static read-only SQL and role/RLS regressions
        run: |
          set -euo pipefail
          bash -n backend/scripts/frfinance_m40240_pg18_rls_catalog_readonly.sh
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40240_pg18_rls_catalog_ci.py \
            backend/tests/test_m40230_role_tenant_boundaries_ci.py \
            backend/tests/test_m40220_anonymous_role_boundaries_ci.py \
            backend/tests/test_m39055_auth_roles_readonly_ci.py
          echo M40240_CI=PASS_STATIC_AND_SYNTHETIC_ONLY
          echo M40240_LIVE_PG18_CATALOG=NOT_QUERIED_BY_CI
          echo M40240_REAL_AUTHENTICATED_RLS=NOT_TESTED
          echo M40240_MIGRATIONS=NONE
          echo M40240_PIX_REAL=OFF
          echo M40240_PRODUCTION=BLOCKED
