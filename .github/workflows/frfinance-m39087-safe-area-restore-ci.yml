name: FR Finance M39087 APK safe-area regression and PG16 encrypted-restore client guard

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'src/tests/android_safe_area_ci.test.ts'
      - '.github/workflows/validacao-atualizacao.yml'
      - 'backend/tests/test_m39086_general_ci_drift_ci.py'
      - 'backend/tests/test_m39087_ci_backup_client_and_session_shell_ci.py'
      - '.github/workflows/frfinance-m39087-safe-area-restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-restore-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline pytest
        run: python -m pip install pytest
      - name: Fail-closed wrapper and SQL catalog contracts
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39087_ci_backup_client_and_session_shell_ci.py \
            backend/tests/test_m39086_general_ci_drift_ci.py \
            backend/tests/test_m19200_migration_inventory_ci.py
          echo 'M39087_RESTORE_REAL=MAIN_DISPOSABLE_CI_ONLY'
          echo 'M39087_DATABASE_WRITES=NONE'
          echo 'M39087_PIX_REAL=OFF'

  android-ui-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_PIX_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lock-pinned frontend
        run: npm ci
      - name: Official TS7 typecheck
        run: npm run lint
      - name: Safe area, three profiles and campaign navigation
        run: |
          npx tsx src/tests/android_safe_area_ci.test.ts
          npx tsx src/tests/role_scope_ui.test.ts
          npx tsx src/tests/m39076_tenant_campaigns_navigation_ci.test.ts
          npx tsx src/tests/m39083_cycle_readiness_ui_ci.test.ts
          echo 'M39087_REAL_PUSH=OFF'
