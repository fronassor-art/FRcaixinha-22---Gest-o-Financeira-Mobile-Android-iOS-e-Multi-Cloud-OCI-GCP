name: FR Finance M40320 - Existing M39034 RLS negative role contexts
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39034_rls_api_offline.py'
      - 'backend/tests/test_m39034_rls_api_offline_ci.py'
      - '.github/workflows/frfinance-m40320-negative-contexts-ci.yml'
      - 'docs/FR_FINANCE_M40320_RLS_DATA_PLANE_NEGATIVE.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m39034_rls_api_offline.py'
      - 'backend/tests/test_m39034_rls_api_offline_ci.py'
      - '.github/workflows/frfinance-m40320-negative-contexts-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-rls-negative-role-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
      FRF_OCI_LAUNCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Existing M39034 with extended M40320 negative contexts and M40310 regressions
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39034_rls_api_offline_ci.py \
            backend/tests/test_m40240_pg18_rls_catalog_ci.py \
            backend/tests/test_m40310_rls_catalog_semantics_ci.py \
            backend/tests/test_m40230_role_tenant_boundaries_ci.py
          echo M40320_CI=PASS_SYNTHETIC_AND_SOURCE_ONLY
          echo M40320_LIVE_PG18=NOT_CONNECTED_BY_CI
          echo M40320_AUTHENTICATED_USER_RLS=NOT_ATTESTED
          echo M40320_DATABASE_WRITES=NONE
          echo M40320_MIGRATIONS=NONE
          echo M40320_PRODUCTION=BLOCKED
