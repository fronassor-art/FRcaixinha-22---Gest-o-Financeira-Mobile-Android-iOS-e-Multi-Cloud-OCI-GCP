name: FR Finance M39081 future-cycle credit protection and synthetic campaign E2E

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/routers/special_credit.py'
      - 'backend/tests/test_m39081_credit_cycle_validity_ci.py'
      - '.github/workflows/frfinance-m39081-credit-cycle-guard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credit-cycle-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
      FR_FINANCE_ACCESS_MAIL_ENABLE: 'OFF'
      FR_FINANCE_ACCESS_MAIL_WORKER: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias FastAPI de teste
        run: python -m pip install -r backend/requirements.txt
      - name: Validar data do ciclo e contrato do fluxo completo sintetico
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39081_credit_cycle_validity_ci.py \
            backend/tests/test_m39033_special_credit_route_flow_ci.py \
            backend/tests/test_m39020_special_credit_api_ci.py \
            backend/tests/test_m39080_credit_campaign_cycle_readonly_ci.py
          echo 'M39081_ORIGINAL_PG18=NOT_CONNECTED'
          echo 'M39081_SYNTHETIC_CYCLE_GRANTS_CAMPAIGN_REPLY=TESTED_ONLY'
          echo 'M39081_FINANCIAL_DATABASE_WRITES=NONE'
          echo 'M39081_REAL_CREDIT=OFF'
          echo 'M39081_PIX_REAL=OFF'
          echo 'M39081_EXTERNAL_DELIVERY=OFF'
