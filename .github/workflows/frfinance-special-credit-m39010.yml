name: FR Finance M39010 - Credito Especial e Canais (CI offline)

on:
  push:
    branches:
      - atualizacao-ai-studio-9b46a63187
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fr-finance-special-credit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Regras de credito especial e quatro adaptadores sem envio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias da API
        run: python -m pip install -r backend/requirements.txt
      - name: Compilar codigo Python
        run: |
          python -m py_compile backend/app/special_credit_contract.py
          python -m py_compile backend/app/special_credit_channels.py
          python -m py_compile backend/app/routers/special_credit.py
      - name: Testar valores, seguranca, consentimento e envelopes
        env:
          FR_FINANCE_SPECIAL_CREDIT_SANDBOX: "NO"
          FR_FINANCE_PIX_REAL: "OFF"
        run: python -m pytest -q backend/tests/test_special_credit_contract_ci.py
      - name: FastAPI RBAC e handoff Termux gated
        run: python -m pytest -q backend/tests/test_m39020_special_credit_api_ci.py backend/tests/test_m39020_termux_handoff_ci.py backend/tests/test_m39026_credit_only_preflight_ci.py backend/tests/test_m39032_post_migration_readonly_ci.py backend/tests/test_m39033_special_credit_route_flow_ci.py backend/tests/test_m39034_rls_api_offline_ci.py backend/tests/test_m39035_single_directory_ci.py backend/tests/test_m39044_credit_workflow_offline_ci.py backend/tests/test_m39045_query_plans_readonly_ci.py backend/tests/test_m39046_execute_selects_readonly_ci.py backend/tests/test_m39049_original_app_auth_credit_ci.py backend/tests/test_m39051_local_apk_api_ci.py backend/tests/test_m39054_auth_pg18_preflight_ci.py

  frontend:
    name: React, tipos e build android-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript sem erros
        run: npm run lint
      - name: Contrato UI campanhas e push Android sem envio
        run: npx tsx src/tests/m39020_credit_push_ui_ci.test.ts
      - name: M39048 sessao e contexto de caixinha no cliente Android offline
        run: npx tsx src/tests/m39048_credit_auth_boundary_ci.test.ts
      - name: Build frontend
        run: npm run build

  sql-disposable:
    name: SQL 110-111 - PostgreSQL 18 descartavel, transicoes e RLS FORCE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_ci_disposable
          POSTGRES_DB: frfinance_ci_credit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: only_ci_disposable
      PGDATABASE: frfinance_ci_credit
    steps:
      - uses: actions/checkout@v4
      - name: Preparar esquema minimo descartavel
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE frc_ai_app NOLOGIN;
          CREATE TABLE public.users (id uuid PRIMARY KEY);
          CREATE TABLE public.tenants (
            id uuid PRIMARY KEY,
            admin_user_id uuid NOT NULL REFERENCES public.users(id),
            status text NOT NULL DEFAULT 'ATIVO'
          );
          CREATE TABLE public.cycles (
            id uuid PRIMARY KEY,
            tenant_id uuid NOT NULL REFERENCES public.tenants(id),
            status text NOT NULL DEFAULT 'ABERTO'
          );
          CREATE TABLE public.memberships (
            id uuid PRIMARY KEY,
            tenant_id uuid NOT NULL REFERENCES public.tenants(id),
            user_id uuid NOT NULL REFERENCES public.users(id),
            role text NOT NULL DEFAULT 'TENANT_MEMBER',
            status text NOT NULL DEFAULT 'ATIVA'
          );
          GRANT SELECT ON public.users,public.tenants,
            public.cycles,public.memberships TO frc_ai_app;
          SQL
      - name: Executar SQL 110 e 111 em UMA transacao no PostgreSQL 18 descartavel
        run: |
          psql -X -v ON_ERROR_STOP=1 --single-transaction \
            -c "SET frfinance.m39020_migration_mode='CI_DISPOSABLE'" \
            -f backend/migrations/110_fr_finance_special_credit_offline.sql \
            -f backend/migrations/111_frfinance_special_credit_integrity_guards.sql
      - name: Teste E2E SQL de integridade, permissoes e revogacao
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/sql/m39020_special_credit_integrity_ci.sql
      - name: M39047 fluxo admin/membro real com rollback no PG18 descartavel
        run: |
          test "$PGDATABASE" = "frfinance_ci_credit"
          test "$PGPORT" = "5432"
          test "$GITHUB_ACTIONS" = "true"
          psql -X -v ON_ERROR_STOP=1 \
            -c "SET frfinance.m39047_test_mode='CI_DISPOSABLE'" \
            -f backend/tests/sql/m39047_credit_transaction_rollback_ci.sql
      - name: Verificar tabelas e RLS obrigatorios
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE count_ready integer;
          BEGIN
           SELECT count(*) INTO count_ready FROM pg_class
            WHERE oid IN (
             'public.special_credit_grants'::regclass,
             'public.special_credit_campaigns'::regclass,
             'public.special_credit_recipients'::regclass,
             'public.special_credit_preferences'::regclass,
             'public.special_credit_outbox'::regclass,
             'public.special_credit_audit'::regclass)
             AND relrowsecurity AND relforcerowsecurity;
           IF count_ready<>6 THEN
             RAISE EXCEPTION 'RLS FORCE ausente em % de 6 tabelas',count_ready;
           END IF;
           IF has_table_privilege('frc_ai_app',
             'public.special_credit_outbox','UPDATE')
             OR has_table_privilege('frc_ai_app',
             'public.special_credit_outbox','DELETE') THEN
             RAISE EXCEPTION 'Outbox permite mutacoes financeiras de canais';
           END IF;
          END $$;
          SQL
      - name: Confirmar isolacao do Termux e ausencia de Pix
        run: |
          test "$PGDATABASE" = "frfinance_ci_credit"
          test "$PGPORT" = "5432"
          ! grep -Ei '\b(insert into loans|update loans|pix_transfer|money_out)\b' backend/migrations/11{0,1}_*.sql

  apk-debug-local:
    name: M39052 APK diagnostico paralelo sem alterar instalacao existente
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FRCAIXINHA_ANDROID_LOCAL_TEST: "1"
      VITE_API_URL: "http://127.0.0.1:8000"
      VITE_FR_FINANCE_PUSH_DIAGNOSTIC: "NO"
      FR_FINANCE_ANDROID_RELEASE_PROFILE: "0"
      FR_FINANCE_ANDROID_PARALLEL_DIAGNOSTIC: "1"
      FR_FINANCE_PIX_REAL: "OFF"
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: "NO"
      FR_FINANCE_ACCESS_MAIL_ENABLE: "OFF"
      FR_FINANCE_ACCESS_MAIL_WORKER: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Node somente no runner descartavel
        run: npm ci

      - name: TS + contratos de seguranca Android
        run: |
          npm run lint
          npx tsx src/tests/m39020_credit_push_ui_ci.test.ts
          npx tsx src/tests/m39048_credit_auth_boundary_ci.test.ts

      - name: Empacotar web e sincronizar Capacitor debug
        run: |
          npm run build
          npx cap sync android

      - name: Verificar assinatura, rede local e protecoes de producao
        shell: bash
        run: |
          set -euo pipefail
          test "$FRCAIXINHA_ANDROID_LOCAL_TEST" = "1"
          test "$FR_FINANCE_ANDROID_PARALLEL_DIAGNOSTIC" = "1"
          test "$VITE_API_URL" = "http://127.0.0.1:8000"
          test "$FR_FINANCE_PIX_REAL" = "OFF"
          test "$FR_FINANCE_SPECIAL_CREDIT_SANDBOX" = "NO"
          test "$VITE_FR_FINANCE_PUSH_DIAGNOSTIC" = "NO"
          test ! -e android/app/google-services.json
          test -f android/app/src/debug/AndroidManifest.xml
          test -f android/app/src/debug/res/xml/local_api_network_security.xml
          grep -q 'android:networkSecurityConfig="@xml/local_api_network_security"' \
            android/app/src/debug/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' \
            android/app/src/debug/res/xml/local_api_network_security.xml
          grep -Fq 'applicationIdSuffix diagnosticParallel ? ".aistudio.diag" : ".aistudio"' android/app/build.gradle
          test -f android/app/src/main/assets/capacitor.config.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const config=JSON.parse(readFileSync('android/app/src/main/assets/capacitor.config.json','utf8'));
          assert.equal(config.appId,'com.frcaixinha.app');
          assert.equal(config.server?.androidScheme,'http');
          assert.equal(config.server?.cleartext,false);
          const debug=readFileSync('android/app/src/debug/res/xml/local_api_network_security.xml','utf8');
          assert.match(debug,/<base-config cleartextTrafficPermitted="false"/);
          assert.match(debug,/<domain includeSubdomains="false">127\.0\.0\.1<\/domain>/);
          assert.match(debug,/<domain includeSubdomains="false">localhost<\/domain>/);
          console.log('M39052_LOCAL_LOOPBACK_ONLY=PASS');
          JS

      - name: Montar APK debug da branch original
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validar arquivo APK gerado
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          file "$apk"
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(
              Path("android/app/build/outputs/apk/debug/output-metadata.json").read_text()
          )["applicationId"]
          assert package == "com.frcaixinha.app.aistudio.diag", package
          print("M39052_PACKAGE_PARALLEL=" + package)
          print("M39052_EXISTING_APP=com.frcaixinha.app.aistudio_UNCHANGED")
          PY
          sha256sum "$apk" > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          echo "M39052_ANDROID_DEBUG_APK=BUILT" >> "$GITHUB_STEP_SUMMARY"
          echo "M39052_API_LOCAL_LOOPBACK_ONLY=TRUE" >> "$GITHUB_STEP_SUMMARY"
          echo "M39052_PIX_REAL=OFF" >> "$GITHUB_STEP_SUMMARY"
          echo "M39052_EXTERNAL_NOTIFICATIONS=OFF" >> "$GITHUB_STEP_SUMMARY"
          echo "M39052_SIGNING=RUNNER_DEBUG_KEY_NOT_STABLE" >> "$GITHUB_STEP_SUMMARY"
          echo "M39052_REAL_LOGIN_AND_DEVICE_E2E=NOT_ATTESTED" >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK de homologacao no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: FR-Finance-M39052-Android-Diagnostic-Parallel
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
