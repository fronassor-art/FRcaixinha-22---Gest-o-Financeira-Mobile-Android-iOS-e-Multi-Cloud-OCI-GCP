name: FR Finance M39085 credit SQL read-only inventory and RLS regression

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m39046_execute_selects_readonly.py'
      - 'backend/tests/test_m39046_execute_selects_readonly_ci.py'
      - 'backend/app/routers/special_credit.py'
      - '.github/workflows/frfinance-m39085-credit-readonly-inventory-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-and-rls-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: SQL inventory, planning, synthetic RLS and credit regression
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39045_query_plans_readonly_ci.py \
            backend/tests/test_m39046_execute_selects_readonly_ci.py \
            backend/tests/test_m39083_credit_cycle_readiness_ci.py \
            backend/tests/test_m39082_special_credit_cycle_actions_ci.py \
            backend/tests/test_m39081_credit_cycle_validity_ci.py
          echo 'M39085_SQL_QUERIES_EXPECTED=18'
          echo 'M39085_SYNTHETIC_RLS_READS_EXPECTED=32'
          echo 'M39085_ORIGINAL_POSTGRESQL=NOT_CONNECTED'
          echo 'M39085_DATABASE_WRITES=NONE'
          echo 'M39085_MIGRATIONS=NONE'
          echo 'M39085_PIX_REAL=OFF'
