name: FR Finance M40100 — exact HTTP statuses and same-UID process candidates

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40100_safe_runtime_triage.py'
      - 'backend/tests/test_m40100_safe_runtime_triage_ci.py'
      - '.github/workflows/frfinance-m40100-safe-runtime-ci.yml'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40100_safe_runtime_triage.py'
      - 'backend/tests/test_m40100_safe_runtime_triage_ci.py'
      - '.github/workflows/frfinance-m40100-safe-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-runtime-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Unit and regression tests without touching any running API
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40100_safe_runtime_triage_ci.py \
            backend/tests/test_m40090_old_fastapi_diagnosis_ci.py \
            backend/tests/test_m40080_loaded_source_ci.py \
            backend/tests/test_m39800_original_fastapi_process_origin_ci.py
          python -B backend/scripts/frfinance_m40100_safe_runtime_triage.py --source-only
          echo M40100_HTTP_STATUS_AND_PS_CANDIDATE_CI=PASS
          echo M40100_PROCESS_CONTROL=NONE
          echo M40100_DATABASE_CONNECTIONS=NONE
          echo M40100_LOCAL_MIGRATIONS=NONE
          echo M40100_PIX_REAL=OFF
          echo M40100_PRODUCTION=BLOCKED
