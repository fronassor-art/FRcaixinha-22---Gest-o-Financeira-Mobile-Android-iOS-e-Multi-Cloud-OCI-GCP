name: FR Finance M40620 all router SQL literal provenance CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/routers/**'
      - 'backend/scripts/frfinance_m40620_all_router_static_sql_guard.py'
      - 'backend/tests/test_m40620_all_router_sql_ci.py'
      - '.github/workflows/frfinance-m40620-all-router-sql-ci.yml'
  pull_request:
    paths:
      - 'backend/app/routers/**'
      - 'backend/scripts/frfinance_m40620_all_router_static_sql_guard.py'
      - 'backend/tests/test_m40620_all_router_sql_ci.py'
      - '.github/workflows/frfinance-m40620-all-router-sql-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-router-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: |
          python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40620_all_router_sql_ci.py
          python -B backend/scripts/frfinance_m40620_all_router_static_sql_guard.py
          echo M40620_ORIGINAL_DATABASES=NEVER_CONNECTED
          echo M40620_FASTAPI_RESTART=NONE
          echo M40620_PRODUCTION=BLOCKED
