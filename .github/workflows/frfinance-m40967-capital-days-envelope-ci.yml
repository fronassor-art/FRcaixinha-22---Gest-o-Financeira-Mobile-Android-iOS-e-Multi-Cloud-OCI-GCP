name: FR Finance M40967 Capital-Dias canonical preview envelope
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'src/services/capitalDaysV22.ts'
      - 'src/tests/m40965_capital_days_v22.test.ts'
      - 'src/tests/m40966_capital_days_scope_v22.test.ts'
      - 'src/tests/m40967_capital_days_envelope_v22.test.ts'
      - '.github/workflows/frfinance-m40967-capital-days-envelope-ci.yml'
      - 'docs/FR_FINANCE_M40967_CAPITAL_DIAS_PREVIEW_ENVELOPE.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/services/capitalDaysV22.ts'
      - 'src/tests/m40965_capital_days_v22.test.ts'
      - 'src/tests/m40966_capital_days_scope_v22.test.ts'
      - 'src/tests/m40967_capital_days_envelope_v22.test.ts'
      - '.github/workflows/frfinance-m40967-capital-days-envelope-ci.yml'
      - 'docs/FR_FINANCE_M40967_CAPITAL_DIAS_PREVIEW_ENVELOPE.md'
permissions:
  contents: read
jobs:
  canonical-preview-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/m40965_capital_days_v22.test.ts
      - run: npx tsx src/tests/m40966_capital_days_scope_v22.test.ts
      - run: npx tsx src/tests/m40967_capital_days_envelope_v22.test.ts
