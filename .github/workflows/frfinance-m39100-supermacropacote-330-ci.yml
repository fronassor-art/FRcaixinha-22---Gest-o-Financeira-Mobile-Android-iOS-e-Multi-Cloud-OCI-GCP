name: FR Finance M39100 — 330 requisitos e 2310 etapas imutáveis

on:
  pull_request:
    paths:
      - 'backend/app/m39100_full_traceability.py'
      - 'backend/tests/test_m39100_full_traceability_ci.py'
      - 'backend/scripts/frfinance_m39100_super_macropacote_readonly.py'
      - 'docs/CADERNO_MESTRE_FR_FINANCE_AI_STUDIO.md'
      - 'docs/CONTRATO_TECNICO_MESTRE_FR_FINANCE_AI_STUDIO.md'
      - 'docs/FR_FINANCE_CP20261114_CHECKLIST_INTEGRAL_330.json'
      - 'docs/FR_FINANCE_M24000_CONTRACT_GAP_REGISTER_147.json'
      - 'backend/app/launch_readiness.py'
      - 'backend/app/release_evidence_matrix.py'
      - 'backend/app/operator_release_worklist.py'
      - '.github/workflows/frfinance-m39100-supermacropacote-330-ci.yml'
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/m39100_full_traceability.py'
      - 'backend/tests/test_m39100_full_traceability_ci.py'
      - 'backend/scripts/frfinance_m39100_super_macropacote_readonly.py'
      - 'docs/FR_FINANCE_CP20261114_CHECKLIST_INTEGRAL_330.json'
      - '.github/workflows/frfinance-m39100-supermacropacote-330-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m39100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  immutable-contract-matrix:
    name: 330 referencias + 2310 passos sem ativacao
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: backend
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pytest pinado
        run: python -m pip install pytest==8.3.4
      - name: Guardar 330 requisitos contra perda e falsa aprovacao
        run: |
          python -B -m pytest -q -p no:cacheprovider backend/tests/test_m39100_full_traceability_ci.py
      - name: Checar matriz 330 e 2310 etapas (sem efeitos externos)
        run: |
          python -B backend/scripts/frfinance_m39100_super_macropacote_readonly.py audit
          python -B backend/scripts/frfinance_m39100_super_macropacote_readonly.py json > /tmp/m39100_summary.json
          python -B - <<'PY'
          import json
          v=json.load(open('/tmp/m39100_summary.json',encoding='utf8'))
          assert v['items_checked']==330
          assert v['macro_tasks_planned']==2310
          assert v['production_release']=='BLOCKED'
          assert v['real_pix'] is False
          assert v['database_writes']==0
          print('M39100_MATRIX_330=PASS')
          print('M39100_2310_STEPS=PASS')
          print('M39100_PRODUCTION_RELEASE=BLOCKED')
          PY
