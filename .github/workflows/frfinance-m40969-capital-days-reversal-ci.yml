name: FR Finance M40969 Capital-Dias explicit reversal lineage
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'src/services/capitalDaysV22.ts'
      - 'src/tests/m40965_capital_days_v22.test.ts'
      - 'src/tests/m40966_capital_days_scope_v22.test.ts'
      - 'src/tests/m40967_capital_days_envelope_v22.test.ts'
      - 'src/tests/m40968_capital_days_nonce_v22.test.ts'
      - 'src/tests/m40969_capital_days_reversal_v22.test.ts'
      - '.github/workflows/frfinance-m40969-capital-days-reversal-ci.yml'
      - 'docs/FR_FINANCE_M40969_CAPITAL_DIAS_REVERSAL_LINEAGE.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/services/capitalDaysV22.ts'
      - 'src/tests/m40965_capital_days_v22.test.ts'
      - 'src/tests/m40966_capital_days_scope_v22.test.ts'
      - 'src/tests/m40967_capital_days_envelope_v22.test.ts'
      - 'src/tests/m40968_capital_days_nonce_v22.test.ts'
      - 'src/tests/m40969_capital_days_reversal_v22.test.ts'
      - '.github/workflows/frfinance-m40969-capital-days-reversal-ci.yml'
      - 'docs/FR_FINANCE_M40969_CAPITAL_DIAS_REVERSAL_LINEAGE.md'
permissions:
  contents: read
jobs:
  explicit-capital-reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/m40965_capital_days_v22.test.ts
      - run: npx tsx src/tests/m40966_capital_days_scope_v22.test.ts
      - run: npx tsx src/tests/m40967_capital_days_envelope_v22.test.ts
      - run: npx tsx src/tests/m40968_capital_days_nonce_v22.test.ts
      - run: npx tsx src/tests/m40969_capital_days_reversal_v22.test.ts
