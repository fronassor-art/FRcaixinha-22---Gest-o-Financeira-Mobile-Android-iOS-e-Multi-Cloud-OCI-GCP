name: FR Finance M40880 Android safe inset and SQL113 GUC NO-GO
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'src/index.css'
      - 'src/components/LoginView.tsx'
      - 'src/tests/m40510_android_login_viewport_ci.test.ts'
      - 'src/tests/m40860_android_single_inset_ci.test.ts'
      - 'backend/scripts/frfinance_m40870_sql113_guc_inventory.py'
      - 'backend/tests/test_m40870_sql113_guc_inventory_ci.py'
      - '.github/workflows/frfinance-m40880-android-sql-inventory-ci.yml'
      - '.github/workflows/validacao-atualizacao.yml'
  pull_request:
    paths:
      - 'src/index.css'
      - 'src/components/LoginView.tsx'
      - 'backend/scripts/frfinance_m40870_sql113_guc_inventory.py'
      - 'backend/tests/test_m40870_sql113_guc_inventory_ci.py'
permissions:
  contents: read
jobs:
  offline-sql113-guc-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40870_sql113_guc_inventory_ci.py
      - run: python -B backend/scripts/frfinance_m40870_sql113_guc_inventory.py
