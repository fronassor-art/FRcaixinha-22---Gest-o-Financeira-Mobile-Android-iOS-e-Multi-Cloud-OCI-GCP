name: FR Finance M40720 client Ed25519 HTTP PoP and disposable PG18 CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40720_client_pop_gateway_disposable.py'
      - 'backend/tests/test_m40720_client_pop_ci.py'
      - '.github/workflows/frfinance-m40720-client-pop-ci.yml'
      - 'docs/FR_FINANCE_M40720_ED25519_HTTP_POP_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40720_client_pop_gateway_disposable.py'
      - 'backend/tests/test_m40720_client_pop_ci.py'
      - '.github/workflows/frfinance-m40720-client-pop-ci.yml'
      - 'docs/FR_FINANCE_M40720_ED25519_HTTP_POP_NO_GO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40720_client_pop_ci.py

  disposable-pg18-ed25519-http:
    needs: offline-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m40720_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40720_synthetic_ci
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m40720_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40720_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_M40720_DATABASE_URL: postgresql://postgres:only_m40720_synthetic_ci@127.0.0.1:55441/fr_m40720_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4' 'fastapi==0.115.12' 'httpx==0.28.1' 'cryptography==45.0.7'
      - run: |
          python -B backend/tests/m40720_client_pop_gateway_disposable.py
          echo M40720_CLIENT_ED25519_ONLY_SYNTHETIC=PASS
          echo M40720_STOLEN_BEARER_AND_SIGNED_HTTP=CONFIRMED_NO_GO
          echo M40720_SQL_HMAC_SECRET_STILL_IN_DB=NO_GO
          echo M40720_ORIGINAL_PG18=NOT_CONNECTED
          echo M40720_PRODUCTION=BLOCKED
