name: FR Finance M40110 — Correlation read-only listener

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40110_listener_correlation_readonly.py'
      - 'backend/tests/test_m40110_listener_correlation_ci.py'
      - '.github/workflows/frfinance-m40110-listener-correlation-ci.yml'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40110_listener_correlation_readonly.py'
      - 'backend/tests/test_m40110_listener_correlation_ci.py'
      - '.github/workflows/frfinance-m40110-listener-correlation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-readonly-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Read-only synthetic ps/lsof and prior runtime regressions
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40110_listener_correlation_ci.py \
            backend/tests/test_m40100_safe_runtime_triage_ci.py \
            backend/tests/test_m40090_old_fastapi_diagnosis_ci.py \
            backend/tests/test_m39800_original_fastapi_process_origin_ci.py
          python -B backend/scripts/frfinance_m40110_listener_correlation_readonly.py --source-only
          echo M40110_READONLY_CORRELATION_CI=PASS
          echo M40110_PROCESS_CONTROL=NONE
          echo M40110_ORIGINAL_DATABASE_ACCESS=NONE
          echo M40110_LOCAL_MIGRATIONS=NONE
          echo M40110_PIX_REAL=OFF
          echo M40110_PRODUCTION=BLOCKED
