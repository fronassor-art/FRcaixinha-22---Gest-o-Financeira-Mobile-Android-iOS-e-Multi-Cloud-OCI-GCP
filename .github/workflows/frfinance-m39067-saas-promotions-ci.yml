name: FR Finance M39067 SaaS Master promotional pricing CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/migrations/112_frfinance_master_independent_saas_prices.sql'
      - 'backend/migrations/113_frfinance_saas_new_admin_promotions.sql'
      - 'backend/migration_catalog_ai_studio.json'
      - 'backend/app/routers/saas_promotions.py'
      - 'backend/app/routers/master.py'
      - 'backend/app/main.py'
      - 'backend/scripts/frfinance_m39067_apply_saas_prices_promotions_pg18.py'
      - 'backend/scripts/frfinance_m39066_master_prices_sql112_termux.py'
      - 'backend/tests/test_m39067_master_saas_promotions_ci.py'
      - 'backend/tests/test_m39066_master_independent_saas_prices_ci.py'
      - 'src/services/financialApiService.ts'
      - 'src/components/SaasPromotionsPanel.tsx'
      - 'src/components/MasterLicensingView.tsx'
      - 'docs/CONTRATO_TECNICO_MESTRE_FR_FINANCE_AI_STUDIO.md'
      - 'docs/CADERNO_MESTRE_FR_FINANCE_AI_STUDIO.md'
      - '.github/workflows/frfinance-m39067-saas-promotions-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m39067-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-saas-promotions:
    name: Caderno Contrato Master Offers RBAC CI only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_ACCESS_MAIL_ENABLE: 'OFF'
      FR_FINANCE_ACCESS_MAIL_WORKER: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias fixadas do FastAPI
        run: python -m pip install -r backend/requirements.txt
      - name: Catalogo SQL inalterado e hash SQL112 SQL113
        run: python -B backend/scripts/aistudio_migration_inventory.py repo-check
      - name: Testes autenticação Master campanhas e preços
        env:
          PYTHONPATH: backend
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39066_master_independent_saas_prices_ci.py \
            backend/tests/test_m39067_master_saas_promotions_ci.py \
            backend/tests/test_aistudio_master_catalog.py \
            backend/tests/test_m37452_saas_checkout_chain_ci.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: TypeScript, APK UI fonte e contrato
        run: |
          npm ci
          npm run lint
          npx tsx src/tests/m39003_apk_ui_screenshot_regressions_ci.test.ts
          npx tsx src/tests/m37451_master_no_fictitious_prorata_ci.test.ts
      - name: Nao ocorre migração ou dinheiro real na CI
        run: |
          echo "M39067_SCHEMA=VERSIONED_SQL112_SQL113_CANDIDATE"
          echo "M39067_POSTGRESQL_ORIGINAL=UNTOUCHED"
          echo "M39067_MASTER_PROMOS=BACKEND_FRONTEND_OFFLINE_CI"
          echo "M39067_REAL_PAYMENTS=OFF"
          echo "M39067_EXTERNAL_DELIVERY=OFF"
          echo "M39067_PRODUCTION=BLOCKED"
