name: FR Finance M38450 public DNS transport diagnostic CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns-transport-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Diagnóstico de transporte DNS com resolvedores simulados sem rede
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38450_mail_dns_transport_ci.py \
            backend/tests/test_m38410_brevo_code_variants_ci.py \
            backend/tests/test_m38370_public_mail_dns_failure_diagnosis_ci.py \
            backend/tests/test_m38330_brevo_dkim_txt_live_path_ci.py \
            backend/tests/test_m38290_brevo_dns_policy_ci.py \
            backend/tests/test_m38250_mail_dns_readonly_ci.py
          echo "M38489_PUBLIC_DNS_TRANSPORT_CI=OFFLINE"
          echo "M38489_DNS_EXTERNAL_QUERIES_IN_CI=NONE"
          echo "M38489_THIRD_PARTY_QUERIES_IN_CI=NONE"
          echo "M38489_EMAIL_REAL=OFF"
          echo "M38489_PIX_REAL=OFF"
          echo "M38489_REAL_ACTIVATION=OFF"
          echo "M38489_PRODUCTION=BLOCKED"
