name: FR Finance M40630 synthetic SQL role privilege and GUC adversarial audit
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40630_privileges_guc_disposable.py'
      - 'backend/tests/test_m40630_privileges_guc_ci.py'
      - '.github/workflows/frfinance-m40630-privilege-guc-ci.yml'
  pull_request:
    paths:
      - 'backend/tests/m40630_privileges_guc_disposable.py'
      - 'backend/tests/test_m40630_privileges_guc_ci.py'
      - '.github/workflows/frfinance-m40630-privilege-guc-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40630_privileges_guc_ci.py

  disposable-pg18-only:
    runs-on: ubuntu-latest
    needs: offline-guard
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m39067_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40630_synthetic_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m39067_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40630_DISPOSABLE: '1'
      CI_M40560_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_PROMOTIONS_DATABASE_URL: postgresql://postgres:only_m40630_synthetic_ci@127.0.0.1:55433/fr_m39067_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4'
      - run: |
          python -B backend/tests/m40630_privileges_guc_disposable.py
          echo M40630_ORIGINAL_DATABASES=NEVER_CONNECTED
          echo M40630_NO_GO=GUC_SPOOF_STILL_POSSIBLE
          echo M40630_PRODUCTION=BLOCKED
