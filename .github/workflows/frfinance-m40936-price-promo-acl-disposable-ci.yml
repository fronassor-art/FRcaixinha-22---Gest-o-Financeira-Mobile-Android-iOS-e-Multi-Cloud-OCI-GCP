name: FR Finance M40936 SQL011/112/113 price promotion ACL disposable PG18
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40936_price_promo_acl_rehearsal_disposable.py'
      - 'backend/tests/test_m40936_price_promo_acl_disposable_ci.py'
      - 'backend/tests/m40900_sql113_acl_fence_disposable.py'
      - 'backend/tests/m40560_saas_role_dataplane_disposable.py'
      - 'backend/migrations/011_platform_license_catalog.sql'
      - 'backend/migrations/112_frfinance_master_independent_saas_prices.sql'
      - 'backend/migrations/113_frfinance_saas_new_admin_promotions.sql'
      - '.github/workflows/frfinance-m40936-price-promo-acl-disposable-ci.yml'
      - 'docs/FR_FINANCE_M40936_PRICE_PROMO_ACL_GUC_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40936_price_promo_acl_rehearsal_disposable.py'
      - 'backend/tests/test_m40936_price_promo_acl_disposable_ci.py'
      - '.github/workflows/frfinance-m40936-price-promo-acl-disposable-ci.yml'
permissions:
  contents: read
jobs:
  refuse-unsafe-and-audit-historical-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - name: Verify CI-only identity and historical SQL011/112/113 grants
        run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40936_price_promo_acl_disposable_ci.py
  synthetic-postgresql18-adversarial-write-revoke:
    runs-on: ubuntu-latest
    needs: refuse-unsafe-and-audit-historical-grants
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m39067_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m40936_disposable_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m39067_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40936_DISPOSABLE: '1'
      CI_M40900_DISPOSABLE: '1'
      CI_M40560_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_PROMOTIONS_DATABASE_URL: postgresql://postgres:only_m40936_disposable_ci@127.0.0.1:55433/fr_m39067_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4'
      - name: Prove GUC forged writes before revoke; SQL42501 after revoke
        run: python -B backend/tests/m40936_price_promo_acl_rehearsal_disposable.py
