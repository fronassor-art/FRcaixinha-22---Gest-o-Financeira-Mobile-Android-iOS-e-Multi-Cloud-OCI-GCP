name: FR Finance M40190 — Local operational read-only smoke without process owner

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40190_operational_readonly_checkpoint.py'
      - 'backend/tests/test_m40190_operational_readonly_checkpoint_ci.py'
      - '.github/workflows/frfinance-m40190-operational-readonly-ci.yml'
      - 'docs/FR_FINANCE_M40190_OPERATIONAL_READONLY_CHECKPOINT.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40190_operational_readonly_checkpoint.py'
      - 'backend/tests/test_m40190_operational_readonly_checkpoint_ci.py'
      - '.github/workflows/frfinance-m40190-operational-readonly-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runtime-contract-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Synthetic HTTP smoke and safety regressions
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40190_operational_readonly_checkpoint_ci.py \
            backend/tests/test_m40180_launch_sandbox_guard_ci.py \
            backend/tests/test_m40170_post_android_wal_ci.py \
            backend/tests/test_m40160_original_pg_control_offline_ci.py
          python -B backend/scripts/frfinance_m40190_operational_readonly_checkpoint.py --source-only
          echo M40190_CI=PASS
          echo M40190_REAL_LOGIN=NONE
          echo M40190_DB_WRITES=NONE
          echo M40190_MIGRATIONS=NONE
          echo M40190_PRODUCTION=BLOCKED
