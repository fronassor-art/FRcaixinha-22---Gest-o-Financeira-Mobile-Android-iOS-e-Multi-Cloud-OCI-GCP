name: FR Finance M40010 — Ephemeral committed audit across three PG18 sessions

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/sql/m40010_*'
      - 'backend/tests/test_m40010_disposable_audit_source_ci.py'
      - '.github/workflows/frfinance-m40010-ephemeral-audit-ci.yml'
  pull_request:
    paths:
      - 'backend/tests/sql/m40010_*'
      - 'backend/tests/test_m40010_disposable_audit_source_ci.py'
      - '.github/workflows/frfinance-m40010-ephemeral-audit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m40010-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-source:
    name: Guard source and independent session scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI-only scripts and nonproduction gates
        run: |
          python -B -m unittest discover -s backend/tests \
            -p 'test_m40010_disposable_audit_source_ci.py' -v
          echo M40010_SOURCE_GUARD=PASS
          echo M40010_ORIGINAL_DB_ACCESS=NONE

  audit-ephemeral-pg18:
    name: PG18 committed synthetic audit, two writers, third auditor, RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: frcaixinha_ci
      PGOPTIONS: '-c frfinance.m40010_ci=DISPOSABLE_ONLY'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client in CI
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable database only inside GitHub container
        env:
          PGDATABASE: postgres
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE frcaixinha_ci"
      - name: Separate psql connection 1 — setup synthetic schema
        run: |
          test "$PGDATABASE" = frcaixinha_ci
          test "$PGPORT" = 5432
          test "${GITHUB_ACTIONS:-}" = true
          psql -X -v ON_ERROR_STOP=1 -v CI_M40010_DISPOSABLE=1 \
            -f backend/tests/sql/m40010_disposable_init_pg18_ci.sql
      - name: Separate psql connection 2 — first reviewer roles
        run: |
          psql -X -v ON_ERROR_STOP=1 -v CI_M40010_DISPOSABLE=1 \
            -f backend/tests/sql/m40010_disposable_writer_first_pg18_ci.sql
      - name: Separate psql connection 3 — second reviewer roles
        run: |
          psql -X -v ON_ERROR_STOP=1 -v CI_M40010_DISPOSABLE=1 \
            -f backend/tests/sql/m40010_disposable_writer_second_pg18_ci.sql
      - name: Separate psql connection 4 — audit durable receipts and replay rejection
        run: |
          psql -X -v ON_ERROR_STOP=1 -v CI_M40010_DISPOSABLE=1 \
            -f backend/tests/sql/m40010_disposable_audit_pg18_ci.sql
          echo M40010_POSTGRESQL18_DURABLE_WITHIN_DISPOSABLE_RUN=PASS
          echo M40010_NO_REAL_HUMAN_AUTHENTICATION=TRUE
          echo M40010_APPROVAL_AND_PAYMENTS=OFF
          echo M40010_TERMUX_ACCESS=NONE
          echo M40010_LOCAL_MIGRATIONS=NONE
          echo M40010_ORIGINAL_DB_ACCESS=NONE
          echo M40010_PRODUCTION=BLOCKED
