name: FR Finance M39990 — Draft mandate lifecycle and replay safety

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/exclusive_cashbox_mandate_lifecycle_draft.py'
      - 'backend/tests/test_m39990_mandate_lifecycle_draft_ci.py'
      - '.github/workflows/frfinance-m39990-mandate-lifecycle-ci.yml'
  pull_request:
    paths:
      - 'backend/app/exclusive_cashbox_mandate_lifecycle_draft.py'
      - 'backend/tests/test_m39990_mandate_lifecycle_draft_ci.py'
      - '.github/workflows/frfinance-m39990-mandate-lifecycle-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m39990-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-mandate-events:
    name: Draft appointments withdrawals revocations and session policy regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:.
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_PAYMENTS: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies only
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.4
      - name: Run draft event chain and previous policy/claims tests
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39990_mandate_lifecycle_draft_ci.py \
            backend/tests/test_m39980_review_policy_draft_ci.py \
            backend/tests/test_m39970_review_session_pair_ci.py \
            backend/tests/test_m39950_documentary_review_chain_ci.py
          echo 'M39990_DRAFT_EVENT_CHAIN=PASS'
          echo 'M39990_REAL_MANDATE_AUTHORITY=FALSE'
          echo 'M39990_REAL_REVOCATION_ATTESTED=FALSE'
          echo 'M39990_REVIEW_APPROVAL=BLOCKED'
          echo 'M39990_DATABASE_CONNECTIONS=NONE'
          echo 'M39990_DATABASE_MIGRATIONS=NONE'
          echo 'M39990_REAL_PAYMENTS=OFF'
          echo 'M39990_PRODUCTION=BLOCKED'
