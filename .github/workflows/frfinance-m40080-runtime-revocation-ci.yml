name: FR Finance M40080 — Imported source runtime and revocation isolation CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/main.py'
      - 'backend/app/m40080_loaded_source_marker.py'
      - 'backend/app/routers/exclusive_cashbox_review_gaps.py'
      - 'backend/scripts/frfinance_m40080_loaded_source_readonly.py'
      - 'backend/tests/test_m40080_loaded_source_ci.py'
      - 'backend/tests/test_m40080_revocation_source_ci.py'
      - 'backend/tests/m40080_revocation_sequence_pg18_ci.py'
      - '.github/workflows/frfinance-m40080-runtime-revocation-ci.yml'
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/m40080_loaded_source_marker.py'
      - 'backend/app/routers/exclusive_cashbox_review_gaps.py'
      - 'backend/scripts/frfinance_m40080_loaded_source_readonly.py'
      - 'backend/tests/test_m40080_loaded_source_ci.py'
      - 'backend/tests/test_m40080_revocation_source_ci.py'
      - 'backend/tests/m40080_revocation_sequence_pg18_ci.py'
      - '.github/workflows/frfinance-m40080-runtime-revocation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m40080-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-runtime:
    name: Original FastAPI import fingerprints and safe Termux no-IO source gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend tests
        run: python -m pip install -r backend/requirements.txt
      - name: Static CI guard and FastAPI marker regression
        run: |
          set -euo pipefail
          python -B -m unittest discover -s backend/tests -p 'test_m40080_revocation_source_ci.py' -v
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40080_loaded_source_ci.py \
            backend/tests/test_m40060_review_policy_api_ci.py \
            backend/tests/test_m39800_original_fastapi_process_origin_ci.py
          python -B backend/scripts/frfinance_m40080_loaded_source_readonly.py --source-only
          echo M40080_IMPORT_MARKER_AND_PROVENANCE_SOURCE=PASS
          echo M40080_RUNTIME_PROCESS_ATTESTATION=NOT_PERFORMED_CI
          echo M40080_REAL_REVIEW_APPROVAL=FALSE

  disposable-pg18:
    name: Revocation after commit and owner transfer in disposable PG18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40070_DISPOSABLE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: frcaixinha_ci
      PGOPTIONS: '-c frfinance.m40070_ci=DISPOSABLE_ONLY'
      ENVIRONMENT: development
      FRCAIXINHA_TEST_AUTH: '1'
      AUTH_DATABASE_URL: 'postgresql://fr_m40070_auth:m40070-auth-ci-only@127.0.0.1:5432/frcaixinha_ci'
      DATABASE_URL: 'postgresql://fr_m40070_app:m40070-app-ci-only@127.0.0.1:5432/frcaixinha_ci'
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_PAYMENTS: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
      FR_FINANCE_ACCESS_MAIL_ENABLE: 'OFF'
      FR_FINANCE_ACCESS_MAIL_WORKER: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend and local psql
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          python -m pip install -r backend/requirements.txt
      - name: Create disposable-only schema and CI-only synthetic roles
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$CI_M40070_DISPOSABLE" = 1
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 5432
          test "$PGDATABASE" = frcaixinha_ci
          PGDATABASE=postgres psql -X -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE frcaixinha_ci'
          psql -X -v ON_ERROR_STOP=1 \
            -f backend/tests/sql/m40070_disposable_auth_policy_pg18_ci.sql
      - name: M40070 baseline then M40080 revocation and owner switch
        run: |
          set -euo pipefail
          python -B backend/tests/m40070_pg18_policy_runtime_ci.py
          python -B backend/tests/m40080_revocation_sequence_pg18_ci.py
          echo M40080_DISPOSABLE_REVOCATION_AND_RLS=PASS
          echo M40080_TERMUX_ACCESS=NONE
          echo M40080_ORIGINAL_DATABASE_ACCESS=NONE
          echo M40080_LOCAL_MIGRATIONS=NONE
          echo M40080_REAL_REVIEW_APPROVAL=FALSE
          echo M40080_PIX_REAL=OFF
          echo M40080_PRODUCTION=BLOCKED
