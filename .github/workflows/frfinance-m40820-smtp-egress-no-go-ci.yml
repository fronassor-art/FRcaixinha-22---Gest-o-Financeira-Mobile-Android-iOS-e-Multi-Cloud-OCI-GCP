name: FR Finance M40820 SMTP real network NO-GO offline CI
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/onboarding_mail_transport.py'
      - 'backend/tests/test_m40820_smtp_real_no_go_ci.py'
      - '.github/workflows/frfinance-m40820-smtp-egress-no-go-ci.yml'
      - 'docs/FR_FINANCE_M40820_SMTP_REAL_EGRESS_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/onboarding_mail_transport.py'
      - 'backend/tests/test_m40820_smtp_real_no_go_ci.py'
      - '.github/workflows/frfinance-m40820-smtp-egress-no-go-ci.yml'
permissions:
  contents: read
jobs:
  synthetic-mail-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4 httpx==0.28.1 pydantic==2.12.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40820_smtp_real_no_go_ci.py
