name: FR Finance M38794 project isolation and FR 2.2 exclusion CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-isolation-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: backend
      FR_FINANCE_PIX_REAL: "OFF"
      FR_FINANCE_REAL_USER_ACTIVATION: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest only (no database)
        run: python -m pip install pytest==8.3.4
      - name: Identity reference, no network or PG startup
        run: |
          python backend/scripts/frfinance_m38794_project_isolation.py reference
      - name: Test cross-project isolation and catalog preflight
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38794_project_isolation_ci.py \
            backend/tests/test_m38701_local_043_044_catalog_readonly_ci.py \
            backend/tests/test_m38651_cycle_minimum_contract_drift_ci.py
          echo "M38794_FR_FINANCE_IDENTITY=TESTED_OFFLINE"
          echo "M38794_FR22_CROSS_ACCESS=BLOCKED_BY_DESIGN"
          echo "M38794_LOCAL_RUNNING_CLUSTER=NOT_ATTESTED"
          echo "M38794_ORIGINAL_PG_MUTATIONS=NONE"
          echo "M38794_MIGRATIONS=NONE"
          echo "M38794_PIX_REAL=OFF"
          echo "M38794_USER_ACTIVATION=OFF"
          echo "M38794_PRODUCTION=BLOCKED"
