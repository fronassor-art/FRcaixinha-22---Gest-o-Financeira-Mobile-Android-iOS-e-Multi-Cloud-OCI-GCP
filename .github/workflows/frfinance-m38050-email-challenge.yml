name: FR Finance M38050 email verification challenge quota CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-challenge-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Testar quotas e falha segura sem SMTP
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q -p no:cacheprovider             backend/tests/test_m38050_email_challenge_policy_ci.py             backend/tests/test_m24400_explicit_invite_acceptance_ci.py
          echo "M38069_INVITATION_REAL=OFF"
          echo "M38069_PRODUCTION=BLOCKED"
