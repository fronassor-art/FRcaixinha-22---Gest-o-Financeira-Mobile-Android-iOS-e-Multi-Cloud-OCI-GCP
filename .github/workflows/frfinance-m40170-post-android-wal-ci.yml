name: FR Finance M40170 — Post Android WAL recovery preflight

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40170_post_android_wal_readonly.py'
      - 'backend/tests/test_m40170_post_android_wal_ci.py'
      - '.github/workflows/frfinance-m40170-post-android-wal-ci.yml'
      - 'docs/FR_FINANCE_M40170_POST_ANDROID_RECOVERY.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40170_post_android_wal_readonly.py'
      - 'backend/tests/test_m40170_post_android_wal_ci.py'
      - '.github/workflows/frfinance-m40170-post-android-wal-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-wal-recovery-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Synthetic WAL metadata and previous runtime regression
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40170_post_android_wal_ci.py \
            backend/tests/test_m40160_original_pg_control_offline_ci.py \
            backend/tests/test_m40150_original_pg18_status_ci.py \
            backend/tests/test_m40140_original_launcher_preflight_ci.py \
            backend/tests/test_m40130_loopback_tcp_health_ci.py
          python -B backend/scripts/frfinance_m40170_post_android_wal_readonly.py --source-only
          echo M40170_CI=PASS
          echo M40170_SQL_SESSIONS=NONE
          echo M40170_DATABASE_WRITES=NONE
          echo M40170_PG_START_STOP=NONE
          echo M40170_REAL_FINANCE=OFF
          echo M40170_PRODUCTION=BLOCKED
