name: FR Finance M40963 V2.2 model integrity manifest
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/routers/contract_models.py'
      - 'backend/app/contract_model_manifest_v22.json'
      - 'backend/tests/test_m40963_contract_model_manifest_ci.py'
      - 'backend/app/main.py'
      - 'src/services/contractModelIntegrityV22.ts'
      - 'src/components/ContractModelPreviewV22.tsx'
      - 'src/tests/m40963_contract_model_integrity_ci.test.ts'
      - '.github/workflows/frfinance-m40963-contract-model-integrity-ci.yml'
      - 'docs/FR_Finance_Caderno_Mestre_V2_2_2026-11-24.md'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/routers/contract_models.py'
      - 'backend/app/contract_model_manifest_v22.json'
      - 'backend/tests/test_m40963_contract_model_manifest_ci.py'
      - 'backend/app/main.py'
      - 'src/services/contractModelIntegrityV22.ts'
      - 'src/components/ContractModelPreviewV22.tsx'
      - 'src/tests/m40963_contract_model_integrity_ci.test.ts'
      - '.github/workflows/frfinance-m40963-contract-model-integrity-ci.yml'
      - 'docs/FR_Finance_Caderno_Mestre_V2_2_2026-11-24.md'
permissions:
  contents: read
jobs:
  backend-contract-model-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40963_contract_model_manifest_ci.py backend/tests/test_m40962_contract_scope_ci.py
  frontend-contract-model-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/m40963_contract_model_integrity_ci.test.ts
      - run: npx tsx src/tests/m40962_contract_models_ci.test.ts
