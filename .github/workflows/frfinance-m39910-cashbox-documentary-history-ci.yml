name: FR Finance M39910 — Historico documental dos caixas (read only)

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/routers/exclusive_cashboxes.py'
      - 'backend/tests/test_m39910_cashbox_documentary_history_ci.py'
      - 'src/services/exclusiveCashboxHistoryBoundary.ts'
      - 'src/services/financialApiService.ts'
      - 'src/components/ExclusiveCashboxView.tsx'
      - 'src/tests/m39910_cashbox_documentary_history_ci.test.ts'
      - '.github/workflows/frfinance-m39910-cashbox-documentary-history-ci.yml'
  pull_request:
    paths:
      - 'backend/app/routers/exclusive_cashboxes.py'
      - 'backend/tests/test_m39910_cashbox_documentary_history_ci.py'
      - 'src/services/exclusiveCashboxHistoryBoundary.ts'
      - 'src/services/financialApiService.ts'
      - 'src/components/ExclusiveCashboxView.tsx'
      - 'src/tests/m39910_cashbox_documentary_history_ci.test.ts'
      - '.github/workflows/frfinance-m39910-cashbox-documentary-history-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m39910-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-read-only-history:
    name: RBAC tenant history and synthetic SQL, no PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:.
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_PAYMENTS: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.4
      - name: API history, cross-tenant denial and M39090 regression
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39910_cashbox_documentary_history_ci.py \
            backend/tests/test_m39090_exclusive_cashboxes_ci.py
          echo 'M39910_DATABASE_WRITES=NONE'
          echo 'M39910_MIGRATIONS=NONE'
          echo 'M39910_PIX_REAL=OFF'

  frontend-read-only-history:
    name: Strict history parser and no stale-API cashbox regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_PAYMENTS: 'OFF'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck and frontend history tests
        run: |
          npm run lint
          npx --no-install tsx src/tests/m39090_exclusive_cashboxes_ci.test.ts
          npx --no-install tsx src/tests/m39900_exclusive_cashbox_evidence_ci.test.ts
          npx --no-install tsx src/tests/m39910_cashbox_documentary_history_ci.test.ts
          echo 'M39910_NO_REAL_MONEY=PASS'
