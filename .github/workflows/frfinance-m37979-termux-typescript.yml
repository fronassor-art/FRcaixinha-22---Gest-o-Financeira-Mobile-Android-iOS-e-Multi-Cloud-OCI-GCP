name: FR Finance M37979 TypeScript Termux compatibility
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  termux-ts6-compatible-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias versionadas
        run: npm ci
      - name: Validar frontend oficial no Linux
        run: bash backend/scripts/frfinance_m37979_termux_frontend.sh
      - name: Auditar as guardas de ambiente e nao mutacao
        run: |
          python -m pytest -q -p no:cacheprovider backend/tests/test_m37979_termux_compiler_guard_ci.py
          echo "M37979_PRODUCTION=BLOCKED"
          echo "M37979_DATABASE=NOT_ACCESSED"
