name: FR Finance M39930 — Immutable ledger and RLS disposable PG18

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/sql/m39930_immutable_ledger_rls_disposable_ci.sql'
      - 'backend/tests/test_m39930_immutable_ledger_rls_source_ci.py'
      - '.github/workflows/frfinance-m39930-immutable-ledger-rls-ci.yml'
  pull_request:
    paths:
      - 'backend/tests/sql/m39930_immutable_ledger_rls_disposable_ci.sql'
      - 'backend/tests/test_m39930_immutable_ledger_rls_source_ci.py'
      - '.github/workflows/frfinance-m39930-immutable-ledger-rls-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m39930-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-guards:
    name: Verify ephemeral-only source gate and no real postings
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI-only PostgreSQL script
        run: |
          python -B -m unittest discover -s backend/tests \
            -p 'test_m39930_immutable_ledger_rls_source_ci.py' -v
          echo 'M39930_ORIGINAL_DB_ACCESS=NONE'
          echo 'M39930_APK_ACTIONS=NONE'

  isolated-pg18:
    name: PostgreSQL 18 deferred balance, append-only, RLS and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: frcaixinha_ci
      PGOPTIONS: '-c frfinance.m39930_ci=DISPOSABLE_ONLY'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL client only
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create isolated database from GitHub Actions service
        env:
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE frcaixinha_ci"
      - name: Prove RLS and accounting invariants in rollback-only transaction
        run: |
          test "$PGDATABASE" = "frcaixinha_ci"
          test "$PGPORT" = "5432"
          psql -X -v ON_ERROR_STOP=1 -v CI_M39930_DISPOSABLE=1 \
            -f backend/tests/sql/m39930_immutable_ledger_rls_disposable_ci.sql
          echo 'M39930_PRODUCTION=BLOCKED'
          echo 'M39930_DB_MIGRATIONS=NONE'
          echo 'M39930_RECONCILED_BALANCES=NONE'
          echo 'M39930_TERMUX_CONNECTIONS=NONE'
