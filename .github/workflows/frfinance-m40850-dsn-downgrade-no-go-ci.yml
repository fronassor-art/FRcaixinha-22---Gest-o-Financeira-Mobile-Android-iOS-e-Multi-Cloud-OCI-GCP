name: FR Finance M40850 DSN downgrade and cached pool NO-GO
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/database.py'
      - 'backend/app/m40800_financial_dsn_guard.py'
      - 'backend/tests/test_m40850_dsn_downgrade_ci.py'
      - '.github/workflows/frfinance-m40850-dsn-downgrade-no-go-ci.yml'
      - 'docs/FR_FINANCE_M40850_DSN_DOWNGRADE_CACHE_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/database.py'
      - 'backend/app/m40800_financial_dsn_guard.py'
      - 'backend/tests/test_m40850_dsn_downgrade_ci.py'
      - '.github/workflows/frfinance-m40850-dsn-downgrade-no-go-ci.yml'
permissions:
  contents: read
jobs:
  offline-financial-db-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4 pytest-asyncio==0.25.3 fastapi==0.115.8 pydantic==2.10.6 asyncpg==0.30.0
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40850_dsn_downgrade_ci.py
