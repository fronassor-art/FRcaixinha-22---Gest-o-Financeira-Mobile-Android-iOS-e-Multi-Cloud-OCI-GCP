name: FR Finance M41060 scoped write RLS and idempotency PG18 disposable
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40700_request_proof_disposable.py'
      - 'backend/tests/test_m40700_request_proof_ci.py'
      - 'backend/tests/m41050_sql_sealed_context_pg18_disposable.py'
      - 'backend/tests/test_m41050_session_context_seal_ci.py'
      - 'backend/tests/test_m41060_write_scope_ci.py'
      - 'backend/tests/m40680_digest_one_time_gateway_disposable.py'
      - 'backend/tests/m40650_token_bound_gateway_disposable.py'
      - '.github/workflows/frfinance-m41060-write-rls-pg18-ci.yml'
      - 'docs/FR_FINANCE_M41060_WRITE_RLS_IDEMPOTENCY_NO_GO.md'
      - 'backend/tests/test_m41080_asyncpg_rls_ci.py'
      - 'docs/FR_FINANCE_M41080_ASYNCPG_RLS_INTEGRATION_NO_GO.md'
      - 'docs/FR_FINANCE_M41090_ASYNCPG_POOL_REUSE_NO_GO.md'
      - 'docs/FR_FINANCE_M41100_ASYNCPG_REVOKED_SESSION_POOL_NO_GO.md'
      - 'docs/FR_FINANCE_M41110_ROLE_BOUND_CAPABILITY_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40700_request_proof_disposable.py'
      - 'backend/tests/test_m40700_request_proof_ci.py'
      - 'backend/tests/m41050_sql_sealed_context_pg18_disposable.py'
      - 'backend/tests/test_m41050_session_context_seal_ci.py'
      - 'backend/tests/test_m41060_write_scope_ci.py'
      - 'backend/tests/m40680_digest_one_time_gateway_disposable.py'
      - 'backend/tests/m40650_token_bound_gateway_disposable.py'
      - '.github/workflows/frfinance-m41060-write-rls-pg18-ci.yml'
      - 'docs/FR_FINANCE_M41060_WRITE_RLS_IDEMPOTENCY_NO_GO.md'
      - 'backend/tests/test_m41080_asyncpg_rls_ci.py'
      - 'docs/FR_FINANCE_M41080_ASYNCPG_RLS_INTEGRATION_NO_GO.md'
      - 'docs/FR_FINANCE_M41090_ASYNCPG_POOL_REUSE_NO_GO.md'
      - 'docs/FR_FINANCE_M41100_ASYNCPG_REVOKED_SESSION_POOL_NO_GO.md'
      - 'docs/FR_FINANCE_M41110_ROLE_BOUND_CAPABILITY_NO_GO.md'
permissions:
  contents: read
jobs:
  offline-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: >-
          python -B -m pytest -q -p no:cacheprovider
          backend/tests/test_m40700_request_proof_ci.py
          backend/tests/test_m41050_session_context_seal_ci.py
          backend/tests/test_m41060_write_scope_ci.py
          backend/tests/test_m41080_asyncpg_rls_ci.py

  pg18-disposable-write-boundary:
    needs: offline-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m40700_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_m41050_disposable_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m40700_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_M41050_DISPOSABLE: '1'
      CI_M41080_DISPOSABLE: '1'
      CI_M41080_DATABASE_URL: postgresql://postgres:only_m41050_disposable_ci@127.0.0.1:55439/fr_m40700_disposable_ci
      CI_M41090_DISPOSABLE: '1'
      CI_M41090_DATABASE_URL: postgresql://postgres:only_m41050_disposable_ci@127.0.0.1:55439/fr_m40700_disposable_ci
      CI_M41100_DISPOSABLE: '1'
      CI_M41100_DATABASE_URL: postgresql://postgres:only_m41050_disposable_ci@127.0.0.1:55439/fr_m40700_disposable_ci
      CI_M41060_DISPOSABLE: '1'
      CI_M40700_DISPOSABLE: '1'
      CI_M40680_DISPOSABLE: '1'
      CI_M40560_DISPOSABLE: '1'
      CI_M41050_DATABASE_URL: postgresql://postgres:only_m41050_disposable_ci@127.0.0.1:55439/fr_m40700_disposable_ci
      CI_M40700_DATABASE_URL: postgresql://postgres:only_m41050_disposable_ci@127.0.0.1:55439/fr_m40700_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4' asyncpg==0.30.0
      - name: Exercise synthetic scoped read/write RLS
        run: python -B backend/tests/m41050_sql_sealed_context_pg18_disposable.py
