name: FR Finance M40600 guarded Termux source-only sync policy
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40600_source_sync_only.py'
      - 'backend/tests/test_m40600_source_sync_policy.py'
      - '.github/workflows/frfinance-m40600-source-sync-policy-ci.yml'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40600_source_sync_only.py'
      - 'backend/tests/test_m40600_source_sync_policy.py'
      - '.github/workflows/frfinance-m40600-source-sync-policy-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40600_source_sync_policy.py
      - run: |
          echo M40600_PG_ORIGINAL=NOT_ACCESSED
          echo M40600_PROCESS_RESTART=NONE
          echo M40600_PRODUCTION=BLOCKED
