name: FR Finance M39960 — Verified session read-only cashbox readiness

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/exclusive_cashbox_review_readiness.py'
      - 'backend/app/routers/exclusive_cashboxes.py'
      - 'backend/tests/test_m39960_exclusive_cashbox_readiness_ci.py'
      - 'backend/tests/test_m39600_cashbox_rls_source_ci.py'
      - '.github/workflows/frfinance-m39960-session-readiness-ci.yml'
  pull_request:
    paths:
      - 'backend/app/exclusive_cashbox_review_readiness.py'
      - 'backend/app/routers/exclusive_cashboxes.py'
      - 'backend/tests/test_m39960_exclusive_cashbox_readiness_ci.py'
      - 'backend/tests/test_m39600_cashbox_rls_source_ci.py'
      - '.github/workflows/frfinance-m39960-session-readiness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frfinance-m39960-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  read-only-identity-boundary:
    name: Strict viewer-only RBAC, token-bound sessions, ownership, no SQL writes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:.
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_PAYMENTS: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.4
      - name: Run session readiness and cashbox regression
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39960_exclusive_cashbox_readiness_ci.py \
            backend/tests/test_m39910_cashbox_documentary_history_ci.py \
            backend/tests/test_m39090_exclusive_cashboxes_ci.py \
            backend/tests/test_m39600_cashbox_rls_source_ci.py
          echo 'M39960_SESSION_BOUND_READ_ONLY=PASS'
          echo 'M39960_REVIEW_APPROVAL=BLOCKED'
          echo 'M39960_DATABASE_WRITES=NONE'
          echo 'M39960_MIGRATIONS=NONE'
          echo 'M39960_FASTAPI_RESTART=NONE'
          echo 'M39960_PIX_REAL=OFF'
          echo 'M39960_PRODUCTION=BLOCKED'
