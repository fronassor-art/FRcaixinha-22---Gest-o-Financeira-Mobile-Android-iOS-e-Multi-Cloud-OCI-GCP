name: FR Finance M40570 user-settable SQL GUC trust-boundary negative test
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/tests/m40570_guc_spoof_disposable.py'
      - 'backend/tests/test_m40570_guc_boundary_guards_ci.py'
      - '.github/workflows/frfinance-m40570-guc-spoof-ci.yml'
      - 'docs/FR_FINANCE_M40570_GUC_TRUST_BOUNDARY_NO_GO.md'
  pull_request:
    paths:
      - 'backend/tests/m40570_guc_spoof_disposable.py'
      - 'backend/tests/test_m40570_guc_boundary_guards_ci.py'
      - '.github/workflows/frfinance-m40570-guc-spoof-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - name: Check fail-closed imports and explicit security finding
        run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40570_guc_boundary_guards_ci.py

  disposable-boundary:
    runs-on: ubuntu-latest
    needs: offline-guard
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fr_m39067_disposable_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: m40570_disposable_ci_only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fr_m39067_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      CI_M40570_DISPOSABLE: '1'
      CI_M40560_DISPOSABLE: '1'
      FRCAIXINHA_CI_ISOLATED: '1'
      CI_PROMOTIONS_DATABASE_URL: postgresql://postgres:m40570_disposable_ci_only@127.0.0.1:55433/fr_m39067_disposable_ci
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.4'
      - name: Demonstrate SQL context forgery only in disposable fixture
        run: |
          python -B backend/tests/m40570_guc_spoof_disposable.py
          echo M40570_RESULT=RISK_REPRODUCED_ONLY_IN_SYNTHETIC_CI
          echo M40570_LIVE_POSTGRESQL=NOT_CONNECTED
          echo M40570_PRODUCTION=BLOCKED