name: FR Finance M38070 outbox persisted receipt resend gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outbox-resend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Conferir recibo duravel contra duplicidade sem envio
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_m38070_persisted_outbox_resend_ci.py \
            backend/tests/test_m26500_delivery_decision_ci.py \
            backend/tests/test_m26300_mail_receipt_audit_policy_ci.py
          echo "M38089_EMAIL_REAL=OFF"
          echo "M38089_PIX_REAL=OFF"
          echo "M38089_PRODUCTION=BLOCKED"
