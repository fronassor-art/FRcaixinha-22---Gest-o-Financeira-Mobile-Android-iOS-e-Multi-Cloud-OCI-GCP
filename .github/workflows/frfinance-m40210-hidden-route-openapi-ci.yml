name: FR Finance M40210 — Hidden M40060 routes OpenAPI classification

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40210_hidden_route_openapi_correction.py'
      - 'backend/tests/test_m40210_hidden_route_openapi_ci.py'
      - '.github/workflows/frfinance-m40210-hidden-route-openapi-ci.yml'
      - 'docs/FR_FINANCE_M40210_HIDDEN_ROUTES.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40210_hidden_route_openapi_correction.py'
      - 'backend/tests/test_m40210_hidden_route_openapi_ci.py'
      - '.github/workflows/frfinance-m40210-hidden-route-openapi-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hidden-api-vs-public-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Correct hidden route expectations and retain regression checks
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40210_hidden_route_openapi_ci.py \
            backend/tests/test_m40200_feature_routes_readonly_ci.py \
            backend/tests/test_m40190_operational_readonly_checkpoint_ci.py \
            backend/tests/test_m40180_launch_sandbox_guard_ci.py
          python -B backend/scripts/frfinance_m40210_hidden_route_openapi_correction.py --source-only
          echo M40210_CI=PASS
          echo M40210_PROTECTED_ENDPOINT_CALLS=NONE
          echo M40210_FINANCIAL_APPROVAL=FALSE
          echo M40210_REAL_PAYMENTS=OFF
          echo M40210_PRODUCTION=BLOCKED
