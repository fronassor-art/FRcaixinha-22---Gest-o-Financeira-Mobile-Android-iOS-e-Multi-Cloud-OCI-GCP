name: FR Finance M38013-M38029 identity consent review scope
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-login-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Multi-tenant legacy login cannot choose first role
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_master_explicit_login_policy.py \
            backend/tests/test_m38001_unique_login_scope_ci.py
  client-contract-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Documentos privados, tenant, sessão e preview sem aceite
        run: |
          npx tsx src/tests/m25300_contract_review_ui_ci.test.ts
          npx tsx src/tests/m38014_contract_review_scope_ci.test.ts
          echo "M38029_REAL_INVITATIONS=OFF"
          echo "M38029_PRODUCTION=BLOCKED"
