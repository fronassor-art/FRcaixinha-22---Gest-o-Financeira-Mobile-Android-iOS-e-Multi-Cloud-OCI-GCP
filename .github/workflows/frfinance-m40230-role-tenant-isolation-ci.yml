name: FR Finance M40230 — Synthetic role tenant and ownership boundaries

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/scripts/frfinance_m40230_role_rls_source_readonly.py'
      - 'backend/tests/test_m40230_role_tenant_boundaries_ci.py'
      - '.github/workflows/frfinance-m40230-role-tenant-isolation-ci.yml'
      - 'docs/FR_FINANCE_M40230_ROLE_TENANT_ISOLATION.md'
  pull_request:
    paths:
      - 'backend/scripts/frfinance_m40230_role_rls_source_readonly.py'
      - 'backend/tests/test_m40230_role_tenant_boundaries_ci.py'
      - '.github/workflows/frfinance-m40230-role-tenant-isolation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tenants-admin-master-and-credit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'backend:.'
      PYTHONDONTWRITEBYTECODE: '1'
      ENVIRONMENT: 'homologation'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'OFF'
      FR_FINANCE_ACCESS_MAIL_ENABLE: 'OFF'
      FR_FINANCE_ACCESS_MAIL_WORKER: 'OFF'
      FRCAIXINHA_CI_ISOLATED: '0'
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Synthetic role denials and existing protected finance regression
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m40230_role_tenant_boundaries_ci.py \
            backend/tests/test_m40220_anonymous_role_boundaries_ci.py \
            backend/tests/test_m40060_review_policy_api_ci.py \
            backend/tests/test_m39090_exclusive_cashboxes_ci.py \
            backend/tests/test_m39020_special_credit_api_ci.py \
            backend/tests/test_m39033_special_credit_route_flow_ci.py
          python -B backend/scripts/frfinance_m40230_role_rls_source_readonly.py --source-only
          echo M40230_CI=PASS_SYNTHETIC_ROLE_ISOLATION_ONLY
          echo M40230_LIVE_POSTGRESQL_RLS=NOT_TESTED
          echo M40230_REAL_AUTH_SESSIONS=NONE
          echo M40230_ORIGINAL_DB_WRITES=NONE
          echo M40230_MIGRATIONS=NONE
          echo M40230_PIX_REAL=OFF
          echo M40230_PRODUCTION=BLOCKED
