name: FR Finance M40938 Master HTTP SQL NO-GO real FastAPI contract
on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/launch_readiness.py'
      - 'backend/app/routers/master.py'
      - 'backend/app/dependencies.py'
      - 'backend/app/m40930_master_write_no_go.py'
      - 'backend/tests/test_m40938_master_http_sql_trust_ci.py'
      - '.github/workflows/frfinance-m40938-master-http-sql-trust-ci.yml'
      - 'docs/FR_FINANCE_M40938_MASTER_HTTP_SQL_NO_GO.md'
  pull_request:
    paths:
      - 'backend/app/launch_readiness.py'
      - 'backend/app/routers/master.py'
      - 'backend/app/dependencies.py'
      - 'backend/app/m40930_master_write_no_go.py'
      - 'backend/tests/test_m40938_master_http_sql_trust_ci.py'
      - '.github/workflows/frfinance-m40938-master-http-sql-trust-ci.yml'
permissions:
  contents: read
jobs:
  verified-master-contract-synthetic-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
      ENVIRONMENT: ci
      PIX_REAL: 'OFF'
      PAGAMENTOS_REAIS: 'OFF'
      ATIVACAO_REAL: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Real FastAPI route with mocked auth token lookup only; no DB
        run: python -B -m pytest -q -p no:cacheprovider backend/tests/test_m40938_master_http_sql_trust_ci.py
