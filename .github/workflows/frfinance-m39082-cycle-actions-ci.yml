name: FR Finance M39082 active-cycle campaign safety synthetic CI

on:
  push:
    branches: [atualizacao-ai-studio-9b46a63187]
    paths:
      - 'backend/app/routers/special_credit.py'
      - 'backend/tests/test_m39082_special_credit_cycle_actions_ci.py'
      - '.github/workflows/frfinance-m39082-cycle-actions-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-cycle-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FR_FINANCE_SPECIAL_CREDIT_SANDBOX: 'NO'
      FR_FINANCE_PIX_REAL: 'OFF'
      FR_FINANCE_REAL_USER_ACTIVATION: 'OFF'
      FR_FINANCE_ACCESS_MAIL_ENABLE: 'OFF'
      FR_FINANCE_ACCESS_MAIL_WORKER: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de teste
        run: python -m pip install -r backend/requirements.txt
      - name: Vigencia ciclo de publicacao, visualizacao, resposta e simulacao
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            backend/tests/test_m39082_special_credit_cycle_actions_ci.py \
            backend/tests/test_m39081_credit_cycle_validity_ci.py \
            backend/tests/test_m39033_special_credit_route_flow_ci.py \
            backend/tests/test_m39020_special_credit_api_ci.py \
            backend/tests/test_m39080_credit_campaign_cycle_readonly_ci.py
          echo 'M39082_ORIGINAL_POSTGRESQL=NOT_CONNECTED'
          echo 'M39082_SYNTHETIC_CYCLES_ONLY=TRUE'
          echo 'M39082_DATABASE_WRITES=NONE'
          echo 'M39082_PIX_REAL=OFF'
          echo 'M39082_EXTERNAL_DELIVERY=OFF'
