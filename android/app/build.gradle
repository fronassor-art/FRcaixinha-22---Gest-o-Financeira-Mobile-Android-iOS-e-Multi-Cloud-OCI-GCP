apply plugin: 'com.android.application'

android {
    namespace = "com.frcaixinha.app"
    // Assinatura duravel para o pacote de homologacao. A chave jamais fica no Git.
    def stableSigningRequired = System.getenv("FRCAIXINHA_ANDROID_REQUIRE_STABLE_SIGNING") == "1"
    def stableKeyFile = System.getenv("FRCAIXINHA_ANDROID_KEYSTORE_FILE")
    def stableStorePassword = System.getenv("FRCAIXINHA_ANDROID_KEYSTORE_PASSWORD")
    def stableKeyAlias = System.getenv("FRCAIXINHA_ANDROID_KEY_ALIAS")
    def stableKeyPassword = System.getenv("FRCAIXINHA_ANDROID_KEY_PASSWORD")
    def androidCiBuildNumber = System.getenv("FRCAIXINHA_ANDROID_VERSION_CODE")
    if (stableSigningRequired && (!stableKeyFile || !stableStorePassword ||
            !stableKeyAlias || !stableKeyPassword || !(new File(stableKeyFile).isFile()))) {
        throw new GradleException("Assinatura Android permanente nao configurada. Configure os segredos de assinatura no GitHub.")
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.frcaixinha.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode monotonicamente crescente no CI, sem downgrade acidental.
        versionCode androidCiBuildNumber ? Integer.parseInt(androidCiBuildNumber) : 1
        versionName androidCiBuildNumber ? "1.0.${androidCiBuildNumber}" : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Gradle so configura a chave quando o CI exigiu assinatura persistente.
    if (stableSigningRequired) {
        signingConfigs {
            stableDebug {
                storeFile file(stableKeyFile)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
                storeType "PKCS12"
            }
        }
    }
    buildTypes {
        // MESMO applicationId em todas as atualizacoes Android AI Studio.
        debug {
            applicationIdSuffix ".aistudio"
            versionNameSuffix "-AI-STUDIO-TEST"
            if (stableSigningRequired) {
                signingConfig signingConfigs.stableDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
