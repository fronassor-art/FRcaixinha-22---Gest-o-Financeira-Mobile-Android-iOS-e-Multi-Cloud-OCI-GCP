<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4" />

  <!-- Shield / Vault Symbol -->
  <g filter="url(#glow)">
    <path d="M256 80 L390 135 C390 260 256 360 256 360 C256 360 122 260 122 135 Z" 
          fill="#065f46" stroke="url(#accent-grad)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Wallet / Safe Icon inside -->
    <rect x="190" y="180" width="132" height="96" rx="16" fill="#10b981" />
    <path d="M190 205 L322 205" stroke="#047857" stroke-width="6" />
    <circle cx="282" cy="235" r="12" fill="#064e3b" stroke="#34d399" stroke-width="4" />
    <circle cx="282" cy="235" r="4" fill="#ffffff" />
  </g>

  <!-- FRcaixinha 2.2 Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    FRcaixinha
  </text>
  <rect x="210" y="440" width="92" height="28" rx="8" fill="#10b981" />
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#064e3b" text-anchor="middle">
    2.2 MOBILE
  </text>
</svg>
